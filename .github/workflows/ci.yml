name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) 门禁 lint —— 只跑「一定是 bug」的规则集，口径刻意收窄。
  #
  # 为什么不直接用 ruff.toml / pyproject 的完整规则集：
  #   实测完整规则集在本仓有 7,177 条违规，其中 6,149 条是 RUF001/002/003
  #   （中文注释里的「全角标点歧义」），对本项目是纯噪声。若强行全量门禁，
  #   CI 会永远红着，等于没有 CI。
  #   门禁集 E9/F63/F7/F82 只覆盖语法错误、未定义名、无效比较/类型字面量，
  #   当前违规数 = 0，是能立刻变绿的「真信号」。
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff — gating rules (syntax / undefined name / invalid comparison)
        working-directory: backend
        run: |
          ruff check --isolated --select E9,F63,F7,F82 \
            agents core api app shared knowledge models scripts

      - name: Ruff — full report (non-blocking, 债务可见但不阻断)
        working-directory: backend
        continue-on-error: true
        run: |
          ruff check --isolated --statistics \
            agents core api app shared knowledge models scripts

  # ─────────────────────────────────────────────────────────────
  # 2) 测试 —— 448 用例，conftest 已封住全部生产数据写入通道。
  #    CODEBUDDY_SAFE_DELETE_ENABLED=0 仅对本次进程生效，用于避开
  #    沙箱批量删除护栏：pytest 结束时清 tmp 目录会触发
  #    SAFE_DELETE_BULK_CONFIRM_REQUIRED，把进程打断（在 GitHub
  #    runner 上无影响，保留是为了本地复现同一命令）。
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    env:
      CODEBUDDY_SAFE_DELETE_ENABLED: "0"
      AGENT_CONTRACT_STRICT: "1"   # 契约越界即抛，把「口头约定」变成硬门禁
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Agent 职责边界契约静态审计
        run: python scripts/audit_agent_contracts.py
