# Review Agent 评分规则配置
# 修改此文件即可调整评分逻辑，无需改动源码

# 基础维度评分起点（key 必须与代码中 _DEFAULT_SCORES 的 key 一致）
dimensions:
  accuracy: 0.75
  professional: 0.70
  completeness: 0.65
  reasoning: 0.80
  structure: 0.75
  actionable: 0.70

# 内容长度评分调整（adjustments 的 key 必须与代码中 dims 的 key 一致）
length_scoring:
  - threshold: 50
    operator: "<"
    adjustments:
      completeness: -0.40
      reasoning: -0.20
      actionable: -0.20
    issues: ["内容严重过短（<50字）"]
  - threshold: 100
    operator: "<"
    adjustments:
      completeness: -0.30
      reasoning: -0.15
      structure: -0.10
    issues: ["内容过短（<100字）"]
  - threshold: 200
    operator: "<"
    adjustments:
      completeness: -0.15
      reasoning: -0.05
    issues: ["内容偏短（<200字）"]
  - threshold: 500
    operator: ">"
    adjustments:
      completeness: 0.05
      professional: 0.05
  - threshold: 800
    operator: ">"
    adjustments:
      completeness: 0.10
      professional: 0.05
      structure: 0.05

# 结构检查规则
structure_checks:
  - name: "活动流程"
    keywords: ["活动流程", "流程"]
    target_tasks: ["活动", "策划"]
    missing_issues: ["缺少活动流程"]
    structure_penalty: -0.2
    actionable_penalty: -0.2

  - name: "预算安排"
    keywords: ["预算"]
    target_tasks: ["预算", "活动", "方案"]
    missing_issues: ["缺少预算安排"]
    structure_penalty: -0.15
    actionable_penalty: -0.15

  - name: "时间安排"
    keywords: ["时间", "日期"]
    target_tasks: ["活动", "策划"]
    missing_issues: ["缺少时间安排"]
    structure_penalty: -0.15
    actionable_penalty: -0.15

# Markdown 格式评分
markdown_scoring:
  - pattern: "# |一、|1\\."
    structure_bonus: 0.2
  - pattern: "## |（一）|1\\.1"
    structure_bonus: 0.1

# 关键词匹配评分
keyword_matching:
  task_keywords: ["活动", "策划", "方案", "项目", "报告"]
  min_match_count: 2
  relevance_bonus: 0.2

# 内容质量加分
quality_bonuses:
  - pattern: "总结|结论"
    structure_bonus: 0.1
    professional_bonus: 0.1
  - pattern: "具体|详细|步骤"
    actionable_bonus: 0.2

