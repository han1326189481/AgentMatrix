  content_length_boost:
    - threshold: 2000
      operator: ">"
      boost: 0.1
    - threshold: 1000
      operator: ">"
      boost: 0.05

  # 多问题/多段落加分
  multi_question_boost: 0.08
  multi_paragraph_boost: 0.08

  # 结构/专业性不足时提高难度
  low_structure_penalty: 0.05
  low_professional_penalty: 0.05
  low_threshold: 0.5

# 评审通过阈值
pass_threshold: 0.65

# 简单对话默认评分
simple_conversation:
  review_score: 0.85
  difficulty_threshold: 0.15
  dimensions:
    structure: 0.80
    relevance: 0.90
    richness: 0.80
    professional: 0.85
    actionable: 0.85