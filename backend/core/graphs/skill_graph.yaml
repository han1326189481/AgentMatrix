  查询（query,_q）:
    aliases:
    - 查询
    - Query
    description: "**查询（Query）**  \n在计算机科学与信息系统中，**查询**指用户或应用程序向数据集合或信息源发出的、用以检索、更新、分析或管理数据的结构化请求。其核心是通过特定语言或接口，精确表达所需数据的条件与操作，并期望系统返回符合要求的结果集合。\
      \  \n\n- 在**数据库领域**，查询通常以 SQL（结构化查询语言）编写，可实现数据的选择（SELECT）、插入（INSERT）、更新（UPDATE）和删除（DELETE）等操作，是数据库管理系统（DBMS）的核心交互方式。\
      \  \n- 在**信息检索领域**，查询表现为关键词串或自然语言输入，搜索引擎据此在索引中匹配并排序相关文档。  \n- 更广义上，查询也泛指对任何结构化或半结构化数据源（如\
      \ XML、图数据库、API）进行的请求，例如 XQuery、SPARQL 或 GraphQL 查询。  \n\n简写 **Q** 常被用作查询的符号，尤其在算法复杂度分析（如\
      \ O(Q)）或查询计划表示中出现。  \n[来源: 百度百科“查询”词条；SQL 标准文档；《数据库系统概论》]"
    domain: tech.ai.agent.multi
    id: 查询（query,_q）
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:20:26'
      audited: true
    name: 查询（Query, Q）
    node_type: concept
  检索增强生成:
    aliases:
    - RAG
    - Retrieval Augmented Generation
    - RAG技术
    description: '检索增强生成（Retrieval-Augmented Generation，简称RAG）是一种结合信息检索与文本生成的自然语言处理技术范式。其核心机制是在生成模型输出答案前，先从外部知识库或文档集合中检索与用户查询相关的信息片段，并将这些检索到的内容作为附加上下文输入生成模型，从而使模型能够依据实时、准确的外部知识生成更可靠、更符合事实的回应，有效缓解大语言模型固有的幻觉问题与知识截止缺陷。RAG通常由检索器和生成器两个组件构成，前者负责从大规模文本语料中高效召回相关文档，后者基于原始输入与检索结果的拼接进行条件生成。这一架构已在开放域问答、对话系统、事实验证等任务中展现出显著性能提升，成为增强预训练语言模型知识覆盖与可解释性的重要方法。
      [来源: 百度百科]'
    domain: tech.ai.agent.memory
    id: 检索增强生成
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:21:03'
      audited: true
    name: 检索增强生成
    node_type: concept
