    - 推送机制
    description: '服务器推送（Server Push）是一种网络通信机制，指服务器在客户端未明确请求的情况下，主动向客户端发送数据。在 HTTP/2
      协议中，服务器推送被正式标准化：当客户端请求一个资源时，服务器可以预判性地将后续可能需要的关联资源（如 CSS、JavaScript、图片）一并推送到客户端缓存，从而减少往返延迟，提升页面加载性能。在更广泛的实时
      Web 应用中，服务器推送也泛指基于长轮询、WebSocket 或 Server-Sent Events 等技术实现的服务端主动消息传递模式，用于即时通知、数据同步等场景。其核心特征是打破传统请求-响应模式，由服务器掌握部分推送主动权。
      [来源: MDN Web Docs / HTTP/2 规范]'
