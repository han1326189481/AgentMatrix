    description: '特色小吃是指根植于特定地域，以独特工艺、风味和民俗文化内涵区别于一般大众化点心或零食的小吃品类。它通常选用地方性食材，运用传统或独创的烹制方法，形成色、香、味、形上的鲜明个性，并常常与当地节庆、礼俗、生活方式紧密相连。特色小吃不仅是即食性的风味食品，更是地方饮食文化的重要载体，承载着历史记忆与地域认同，许多已被纳入非物质文化遗产代表性项目名录。
