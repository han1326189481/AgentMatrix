    - MultiHead Attention
    description: '多头注意力机制是一种在神经网络中用于处理序列数据的注意力机制变体，通过并行执行多个独立的缩放点积注意力计算，使模型能够同时关注输入信息中不同表示子空间的特征。该机制首先将输入的查询、键和值向量通过不同的线性投影映射到多个低维子空间，然后在每个子空间中独立计算注意力权重并聚合值向量，最后将所有头的结果拼接起来并再次进行线性变换。这种设计使模型能够捕捉不同位置、不同粒度或不同类型的依赖关系，避免了单头注意力可能产生的表示偏差。多头注意力机制是
      Transformer 架构的核心组件，广泛应用于自然语言处理、计算机视觉等领域的预训练模型。 [来源: Vaswani et al., "Attention
      Is All You Need", 2017]'
