  性能比较:
    aliases:
    - Performance Comparison
    - 性能对比
    - Performance Benchmark
    description: '性能比较，指在特定条件与评估标准下，对两个或以上系统、组件、算法、产品等被测对象的功能效率、响应速度、资源消耗等表现指标进行横向或纵向的量化分析与差异辨识的过程。通常通过设计统一的负载、输入数据集或典型场景，采集吞吐量、延迟、执行时间、内存占用、能耗等关键性能指标，再运用统计学方法比较实测结果。性能比较广泛应用于计算机体系结构、软件工程、数据库管理、工业测评等领域，是选型决策、性能调优、基准测试验证与市场透明度提升的重要依据。为控制变量、保证可比性，常需规范硬件环境、软件版本、配置参数等测试条件，并采用公认的基准测试套件（如SPEC、TPC）或标准方法。
      [来源: 维基百科]'
