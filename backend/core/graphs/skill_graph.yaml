  中午12:00:
    aliases: []
    description: '中午12:00，即正午12时，是一天中太阳经过当地子午线、达到最高点（中天）的时刻在民用时间系统中的对应表示，通常被定义为白天的中间点。在12小时制中，中午12:00标记上午（AM）的结束与下午（PM）的开始，因此常写作12:00
      noon或12:00 PM。在24小时制中，正午记作12:00。这一时刻并非全球严格同步，而是依据所在时区的标准时间确定；在实施夏令时的地区，正午的钟表时间可能相应调整为13:00。天文学上，视太阳通过子午线的瞬间称为视正午，因地球公转速度不均及黄赤交角影响，视正午与钟表时间的12:00通常存在时差。
