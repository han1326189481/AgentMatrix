    description: '端口在计算机与网络技术中，通常指用于连接设备或进程间通信的逻辑接口或物理接口。在硬件层面，端口是计算机与外围设备（如键盘、鼠标、打印机）进行数据交换的物理连接点，常见类型包括
      USB、HDMI 等。在软件与网络层面，端口是操作系统为网络通信预留的逻辑编号，范围从 0 到 65535，用于区分不同应用程序或服务的数据流。每个端口号与一个
      IP 地址唯一对应一个网络套接字，使传输层协议（如 TCP 或 UDP）能够将数据包准确投递到目标进程。例如，HTTP 服务通常使用 80 端口，HTTPS
      使用 443 端口。端口号由互联网号码分配机构（IANA）统一管理，分为知名端口（0-1023）、注册端口（1024-49151）和动态/私有端口（49152-65535）。[来源:
      维基百科]'
    domain: tech.network
