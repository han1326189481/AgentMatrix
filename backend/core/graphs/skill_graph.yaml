    description: '糯米红枣是一道以红枣和糯米为主要食材的传统中式甜点，常见于家庭烹饪和宴席。其典型做法是将红枣去核后，把用温水调和的糯米粉团（或浸泡过的糯米粒）嵌入枣内，经蒸制而成。成品外观红白相映，红枣香甜软糯，糯米馅心黏韧，口感层次丰富。在饮食文化中，该点心常被赋予“早（枣）遇贵人或甜蜜团圆”的吉祥寓意，同时也被视为兼具补气养血、温暖脾胃的食补小点。不同地区亦有将其煮成甜粥或加入桂花蜜调味的变体。


      [来源: 百度百科]'
