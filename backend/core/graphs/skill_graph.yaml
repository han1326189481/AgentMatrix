  红烧肉:
    aliases:
    - Braised Pork
    - 红烧猪肉
    - Red Braised Pork
    description: '红烧肉是一道以猪五花肉为主料的中式传统菜肴，属于热菜，广泛见于中国各地菜系，尤以本帮菜、湘菜、鲁菜等版本最为知名。其基本工艺为：将带皮五花肉切块后焯水去腥，再以冰糖或白糖炒制糖色，使肉块均匀裹上酱红色泽，随后加入酱油、料酒、八角、桂皮、香叶、葱姜等调料，用小火长时间焖炖至肉质酥烂、汤汁浓稠。成品色泽红润油亮，口感肥而不腻、瘦而不柴，咸中带甜，香气馥郁。红烧肉的历史可追溯至北魏《齐民要术》中记载的类似做法，宋代苏轼所创“东坡肉”为其重要发展形态。因其食材易得、滋味醇厚，已成为中国家庭日常饮食与宴客的经典菜肴，并被视为中式烹饪中“慢火入味”技法的代表之一。
      [来源: 百度百科]'
    domain: creative
    id: 红烧肉
