    - TF-IDF 评分
    - TF-IDF评分机制
    description: "TF-IDF（Term Frequency–Inverse Document Frequency）是一种用于信息检索与文本挖掘的加权统计方法，用以评估一个词语对于语料库中某一份文件的重要程度。其核心思想是：一个词语在某份文件中出现的频率（词频，TF）越高，越能代表该文件的主题；但同时，若该词语在语料库的绝大多数文件中都频繁出现（逆文档频率，IDF\
      \ 低），则其区分能力较弱。故此，词语的重要性与它在当前文件中出现的次数成正比，与它在整个语料库中出现过的文件数成反比。最终评分通常由 TF 与 IDF\
      \ 的乘积得到，常用于搜索引擎的文档排序、关键词提取、文本相似性计算等任务，是向量空间模型中最经典的权重计算方式之一。  \n[来源: 维基百科]"
    domain: tech.ai.rag.retrieval
