    description: '可观察性与控制是控制系统理论中的两个基本属性，用于描述动态系统与其外部环境交互的能力。可观察性指通过测量系统外部输出变量，能否唯一确定系统内部状态的能力；若在有限时间内，通过输出观测值可唯一重构初始状态，则称系统状态完全可观察。控制性（即可控性）指通过施加外部输入信号，能否将系统从任意初始状态引导至任意期望状态的能力；若存在允许的控制输入在有限时间内实现该转移，则称系统状态完全可控。两者互为对偶概念，由鲁道夫·卡尔曼于1960年正式引入现代控制理论，构成状态空间分析与设计的基础，广泛应用于工程、经济与管理等复杂动态系统的建模、滤波与反馈控制。


