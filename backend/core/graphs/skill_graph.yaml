  跨注意力机制:
    aliases:
    - Attention Mechanism
    - Attention
    - 注意力
    description: '跨注意力机制（Cross-Attention）是深度学习中注意力机制的一种变体，主要用于序列到序列（Seq2Seq）模型，尤其是Transformer架构的解码器部分。在跨注意力机制中，查询（Query）来自当前目标序列（如解码器前一层的输出），而键（Key）和值（Value）则来自另一个来源序列（如编码器对输入序列的完整表示）。通过计算查询与键之间的相似度，并以此加权聚合来自来源序列的值，该机制能够动态地对齐并融合不同模态或不同序列之间的信息，使模型在生成每个目标元素时都能有选择性地关注源序列中的相关部分。跨注意力机制被广泛应用于机器翻译、文本摘要、图像描述生成以及多模态模型（如图文匹配、视觉问答等），是构建不同序列间依赖关系的核心技术。[来源:
      《Attention Is All You Need》（Vaswani et al., 2017）]'
    domain: tech.ai.agent.multi
    id: 跨注意力机制
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:35:02'
      audited: true
    name: 跨注意力机制
    node_type: concept
  输入序列:
    aliases:
    - Input Sequence
    - 输入串
    - Input Token Sequence
    description: '输入序列是指在特定计算模型、信号处理系统或数学变换中，按预定时序或逻辑顺序提供的一组有序数据元素。这些元素通常由外部环境或上游模块产生，作为系统的激励、操作数或待处理信号进入处理单元，驱动后续的程序执行、状态迁移或结果生成。在自动机理论中，输入序列是驱动自动机从初始状态转向其他状态的符号串；在神经网络领域，它指代按时间步依次馈入网络的向量集合；在数字信号处理中，指经采样得到的离散时间信号采样值的有序排列。输入序列的长度可以是有限的或潜在无限的，其每一个位置上的取值受特定字母表或值域约束。通过依次读取输入序列中的元素，系统完成预定的计算或变换任务。[来源:
      计算机科学与工程百科]'
    domain: tech.ai.agent.multi
    id: 输入序列
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:35:18'
      audited: true
    name: 输入序列
    node_type: concept
  输出序列:
    aliases:
    - Output Sequence
    - 输出串
    - Output Token Sequence
    description: '输出序列是指由系统、模型或算法在处理输入数据后，按时间步或位置顺序生成的一组有序输出元素。在序列到序列（Seq2Seq）学习框架中，给定一个输入序列，编码器将其压缩为上下文向量，解码器依序逐元素产生目标序列，该目标序列即为输出序列。输出序列中的每个元素可以是离散的符号（如单词、字符）或连续的数值（如时间序列预测值），其生成过程通常依赖自回归机制，即当前时刻的输出依赖于前一时刻的输出及上下文信息。该概念广泛应用于机器翻译、语音识别、文本生成等任务，是序列建模的核心组成部分。[来源:
      《深度学习》(Goodfellow, Bengio & Courville, 2016)]'
