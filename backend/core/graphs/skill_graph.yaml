    description: '总预算是指在特定时期内，一个经济主体（如政府、企业、家庭）为完成其全部计划活动所编制的收入与支出的总体计划。它综合反映该主体全部财政资源的来源与运用，通常涵盖经常性收支与资本性收支两个部分，是进行资源分配、财务控制和绩效评估的核心工具。在政府财政中，总预算一般由本级预算和汇总的下级预算组成，经法定程序批准后执行，体现公共资金的统筹安排。企业总预算则包含经营预算、资本预算和财务预算，最终形成预计利润表、资产负债表和现金流量表，以实现战略目标的全面量化。总预算的编制需遵循完整性、统一性和可靠性原则，确保无一遗漏地反映所有收支，不得以收抵支或存在预算外资金。[来源:
