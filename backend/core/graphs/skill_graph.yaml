  苏州汤包:
    aliases:
    - Suzhou Soup Bun
    - 苏州小笼包
    - Suzhou Tangbao
    description: 苏州汤包是江苏苏州传统特色小吃，属苏式面点中的经典品种，与苏式小笼馒头有紧密关联。它以薄韧的面皮包裹富含汤汁的鲜肉馅心，经小笼蒸制而成。其核心特征在于皮薄透亮、馅大汁多、顶端收口处带有一个小孔用以散发热气，食用时先咬开小口吸吮汤汁以防烫嘴。馅料多以猪前腿肉为主，配以葱花、姜末、酱油、白糖等调味，其中糖的用量较上海南翔小笼更明显，呈鲜甜回甘的风味；皮冻是高汤包汤汁丰盈的关键。成品较小巧，通常一客数只，蘸食镇江香醋和嫩姜丝，能解腻提鲜。苏州汤包讲究现做现蒸现食，与生煎馒头、馄饨等同为苏州早茶和市井饮食的代表。［来源：百度百科］
