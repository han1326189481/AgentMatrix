  效果不确定性:
    aliases:
    - Effect Uncertainty
    - 效果风险
    - Outcome Uncertainty
    description: '效果不确定性指在特定干预、政策或行为实施后，其最终结果在方向、程度或持续时间等方面难以预先精确估测的状态。与仅反映事件发生概率的风险不同，效果不确定性强调因果链条中多重因素交互作用导致的认知局限，既可能源于模型结构的不完备、参数估计的误差，也可能来自外部环境的变化或个体异质性。在公共政策分析、临床医学和项目评估中，效果不确定性常通过敏感性分析、场景模拟或稳健性检验等方法加以刻画与呈现，以辅助决策者在信息不完备条件下进行权衡。
