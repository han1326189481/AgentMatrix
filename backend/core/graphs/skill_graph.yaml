    description: '用户满意度是用户对产品或服务满足其需求与期望的程度所作出的综合主观评价。它源于用户接受产品或服务后的感知绩效与其期望值的比较，当感知绩效大于或等于期望时产生满意，低于期望时则产生不满。该概念常用于市场营销、服务管理及用户体验领域，通过问卷调查、评分量表等方式量化，反映用户对特定交互过程的整体情感响应。其形成受产品质量、服务体验、品牌形象及个体差异等多因素影响，是衡量组织绩效和改进方向的关键指标。
