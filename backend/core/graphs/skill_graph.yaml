    - Node Port Service
    description: 'NodePort 是 Kubernetes 中一种 Service 类型，用于将服务暴露给集群外部访问。配置为 NodePort
      类型的 Service 会在每个节点上分配一个静态端口（默认范围 30000-32767），并将到达该端口上的流量转发到后端 Pod 的对应目标端口上。外部客户端可以通过
      `<NodeIP>:<NodePort>` 访问服务，无需额外的负载均衡器或 Ingress 控制器。NodePort 建立在 ClusterIP 基础之上，除了自动创建
      ClusterIP 外，还在节点层面打开端口，使得集群外能够直接访问。该方式通常用于开发测试场景或简单的对外暴露需求，生产环境中常结合外部负载均衡器使用。
