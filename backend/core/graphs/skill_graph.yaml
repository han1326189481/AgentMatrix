  队头阻塞问题:
    aliases:
    - Head-of-Line Blocking
    - HOL Blocking
    - 队头阻塞
    description: '队头阻塞问题（Head-of-line blocking, HOL blocking）是指在数据通信中，当一系列数据包按序传输时，若队首的数据包因某种原因（如丢失、延迟或等待处理）无法被及时交付，即使后续数据包已成功到达接收缓冲区，也必须等待队首数据包被处理或重传后方可向上层提交，从而导致整体吞吐量下降与延迟增加的现象。该问题最典型地出现在HTTP/1.1基于传输控制协议（TCP）的持久连接中：TCP保证字节流的严格有序交付，若一个HTTP事务对应的TCP段丢失，后续所有事务的响应均被阻塞，即使它们已完整到达。HTTP/2通过在同一TCP连接上引入多路复用帧和流的机制来缓解应用层的队头阻塞，但因仍依赖单一TCP连接，传输层的丢包仍会阻塞所有流。HTTP/3则基于QUIC协议，将多路复用的流分离到独立的数据流中，从而彻底消除了传输层的队头阻塞。此外，队头阻塞问题也存在于输入队列交换结构等场景。


      [来源: 维基百科 Head-of-line blocking；HTTP/2 与 HTTP/3 规范及相关网络协议标准]'
    domain: tech.network
    id: 队头阻塞问题
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T14:01:13'
      audited: true
    name: 队头阻塞问题
    node_type: concept
