  上午10:30:
    aliases: []
    description: '上午10:30是一天中的具体时刻，采用12小时制时间表示法，指介于上午10时整与上午11时整之间的30分位置。在24小时制中，该时刻记为10:30，与夜间时段22:30相区分。“上午”通常指从午夜（0:00）至正午（12:00）的时段，严格边界因文化、制度略有差异，但10:30始终位于上午时段内。在正式文书、国际标准（如ISO
      8601）中，为避免歧义，常结合日期并以24小时制表示，例如写作“T10:30:00”。日常生活中，该表述广泛用于约定、排程及计时。 [来源: ISO
      8601, 时间计量通识]'
    domain: creative
    id: 上午10:30
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T11:50:05'
      audited: true
    name: 上午10:30
    node_type: concept
  下午:
    aliases:
    - Afternoon
    - PM
    - 午后
    description: '下午是一天中介于正午与傍晚之间的时段。通常指12点至日没或18点前后这段时间，具体界定因文化、习惯与使用情境而异。在24小时制中，12:00至18:00常被归为下午；在12小时制中，则标识为12:00
      PM至6:00 PM或至日落。气象学中常将下午定义为12:00至20:00，以统计气温等数据。中国古代以十二时辰划分，午后至日落前为未时（13～15时）与申时（15～17时），亦对应下午。日常语境中，下午通常指正午过后、天黑之前的工作或活动时段。其英文“afternoon”源于“after
      noon”，即正午之后。 [来源: 维基百科]'
    domain: creative
    id: 下午
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T11:50:35'
