    description: '图灵测试是由英国数学家、计算机科学先驱艾伦·图灵于1950年提出的一个思想实验，用于判断机器是否能够表现出与人类无异的智能行为。测试设置如下：一名人类裁判同时与一名人类和一台机器进行文本对话，但裁判不知道对话方的身份；如果裁判无法可靠地区分出哪一方是机器，则称该机器通过了图灵测试。图灵本人将其称为“模仿游戏”。该测试不直接考察机器的内部状态或意识，而是从行为主义角度评估其对话能力、知识运用和语言理解。图灵测试对人工智能哲学产生了深远影响，并推动了对话系统与自然语言处理等领域的发展。需要指出，通过测试并不意味着机器具有意识或真正的理解，而仅表明它能在对话中模拟人类反应。
      [来源: 艾伦·图灵《计算机器与智能》]'
    domain: creative
    id: 图灵测试
    metadata:
