  自注意力:
    aliases:
    - Self-Attention
    - 自注意
    - Self Attention
    description: "自注意力是深度学习中的一种注意力机制，允许模型在处理序列的每个元素时，直接关注同一序列中的所有其他元素，从而动态计算每个位置的表示。与传统的注意力机制不同，自注意力的查询、键和值均来自同一输入序列，使其能够捕获序列内部的全局依赖关系，无论元素之间的距离多远。在具体实现中，模型通过将输入线性投影到多个子空间来计算缩放点积注意力，并为每个位置生成所有位置的注意力权重，经加权求和后获得上下文感知的输出。该机制是Transformer架构的核心组件，被广泛应用于自然语言处理、计算机视觉等领域。\
      \  \n[来源: Vaswani 等人 \"Attention Is All You Need\" (NeurIPS 2017) 及维基百科 Self-attention\
      \ 条目]"
    domain: tech.ai.agent.multi
    id: 自注意力
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:31:15'
      audited: true
    name: 自注意力
    node_type: concept
  苏州工业园区:
    aliases:
    - Suzhou Industrial Park
