  bm25_算法:
    aliases:
    - BM25
    - Okapi BM25
    - Best Match 25
    - BM25算法
    description: 'BM25（Best Match 25）是一种基于概率检索模型的排序函数，用于评估查询与文档之间的相关性得分。它属于词袋检索模型家族，是经典TF-IDF权重的改进方案，由Karen
      Spärck Jones等人在20世纪70年代至90年代逐步发展完善。BM25的核心思想是：在考虑词项频率（TF）的同时，引入文档长度归一化与词频饱和机制，以降低长文档和罕见高频词的不合理偏向。其一般公式为：


      \[

      \text{score}(D,Q) = \sum_{i=1}^{n} \text{IDF}(q_i) \cdot \frac{f(q_i, D) \cdot
      (k_1 + 1)}{f(q_i, D) + k_1 \cdot (1 - b + b \cdot \frac{|D|}{\text{avgdl}})}

      \]


      其中，\(f(q_i, D)\)为词项\(q_i\)在文档\(D\)中的出现频率，\(|D|\)为文档长度，\(\text{avgdl}\)为平均文档长度，\(k_1\)（通常取1.2~2.0）控制词频饱和比例，\(b\)（通常取0.75）调节文档长度归一化强度，\(\text{IDF}(q_i)\)为逆文档频率。BM25因结构简单、调参灵活、无监督等优势，被广泛应用于全文搜索引擎（如Elasticsearch、Lucene）中，作为默认相关性评分算法。
      [来源: 维基百科]'
    domain: tech.ai.rag.retrieval
    id: bm25_算法
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T14:04:30'
      audited: true
    name: BM25 算法
    node_type: concept
