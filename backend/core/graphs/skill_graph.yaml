      \ `true` 和 `false`，而自然数类型的元素有无穷多个。这一概念源自数学中将类型类比于集合、元素类比于集合的成员的理解方式。在具有依赖类型或多态类型的高级类型系统中，类型本身也可以作为另一类型的元素。类型的元素是程序语义、类型检查和形式化验证中的基本概念。\
