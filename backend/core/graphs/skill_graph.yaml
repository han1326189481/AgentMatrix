    - Pan-fried Bun
    description: 生煎包是一种源自中国上海的传统煎制面点，属沪系特色小吃。以发酵面团包裹猪肉馅（常加入皮冻），收口朝下放入平底锅中，加油与水以半煎半蒸方式烹制而成。成品底部金黄酥脆，上部面皮松软，馅料鲜嫩多汁，出锅前常撒上芝麻与葱花增香。其历史可追溯至民国时期，最初由茶楼作为点心供应，后演变为街头常见食品，与“蟹壳黄”等齐名。生煎包讲究“皮薄不破、底脆不焦、汤汁丰盈”，食用时需小心烫口。2010年，上海生煎包制作技艺被列入区级非物质文化遗产名录。［来源：上海市地方志办公室］
