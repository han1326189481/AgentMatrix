    description: '具体解释，又称具体化解释或个案解释，是法律解释学中与抽象解释相对的基本类型。指法律适用者（如法官、行政机关）在裁判或处理具体案件时，结合案件事实与情景，对特定法律规范的含义、适用范围及效果所作出的个别化阐释与说明。其特征为：解释行为发生于法律适用过程之中，解释对象为被适用的具体规范，解释目的指向个案的法律效果裁断，解释结果仅对该个案具有法律约束力，不具有普遍规范性。与之相对的抽象解释不针对特定案件，仅就规范文本的一般含义进行阐明，通常具有普遍效力。在民法、刑法及行政法领域中，具体解释是实现个案正义和规范具体化的重要法律技术。该术语多见于法理学、法律方法论教材及司法解释理论讨论中。

