  实际支出:
    aliases:
    - Actual Expenditure
    - 实际花费
    - Actual Cost
    description: 实际支出是指预算单位或会计主体在预算执行过程中，基于合法凭证并已完成支付行为、取得相应商品或服务后形成的资金耗费。它反映预算资金从国库或单位账户实质流出的结果，强调资金所有权或控制权的转移与义务的终结。在政府预算会计中，实际支出通常与“银行支出数”区分：银行支出数指财政部门或上级单位已拨付但用款单位尚未实际支用的数额，而实际支出数则是用款单位实际消耗并报销的数额。实际支出是核算预算执行进度、编制决算和考核资金使用效益的基础指标，也是预算管理由投入控制向结果导向转型的关键核算节点。其确认需满足款项已付、物资或服务已验收、原始凭证合规等条件，区别于计划支出、应计支出等概念。[来源：百度百科]
