    description: '泛化能力是指机器学习模型对未在训练集中出现的新样本的适应与预测能力。具备良好泛化能力的模型，能够从训练数据中学习到隐藏在数据背后的本质规律，而非仅仅记忆训练样本的个体特征与噪声，从而在面对与训练数据独立同分布或分布相似的未知数据时，依然保持较高的预测准确性与稳定性。泛化能力是衡量模型实用价值的核心指标，与过拟合、欠拟合等概念紧密相关，通常通过将数据集划分为训练集、验证集和测试集，并利用交叉验证等方法进行评估。正则化、早停、数据增强等策略常被用于提升模型的泛化能力。
