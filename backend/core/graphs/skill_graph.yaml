  下午12:00:
    aliases: []
    description: '下午12:00（12:00 PM）是12小时制中表示正午的时刻，指一天之中太阳位于当地子午线上、日影最短的时刻。在24小时制中对应12:00，是上午与下午的分界点，标志着下午时段的开始。正午的精确时刻因经度和均时差而异，但日常计时中通常将时钟12:00作为正午的统一表示。该表示法源于拉丁语“post
      meridiem”（午后），12:00 PM即“午后12时”，有别于午夜的12:00 AM。 [来源: 维基百科 12-hour clock]'
