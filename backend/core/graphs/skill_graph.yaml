    - Soup Dumpling
    description: '小笼包是中国江南地区的一种传统面食，起源于清代道光年间的常州，后在上海、无锡等地发扬光大。它以小巧精致著称，直径约3至5厘米，外皮由未经发酵的面团擀制而成，极薄且富有韧性；内馅多为猪肉，常掺入皮冻，蒸制后皮冻融化成鲜美汤汁，形成“皮薄、馅大、汁多、味鲜”的特色。制作时讲究“提褶”工艺，收口处褶纹清晰，蒸熟后呈半透明状，玲珑剔透。食用时常配以香醋和姜丝，以提鲜解腻。不同流派略有差异，如上海南翔小笼以清水和面、蟹粉入馅见长，无锡小笼则偏甜。小笼包因形似灯笼、汤汁丰盈，被誉为“上海的一张美食名片”，并入选多地非物质文化遗产名录。
      [来源: 百度百科]'
