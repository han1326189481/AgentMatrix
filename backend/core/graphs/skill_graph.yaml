    description: '阳澄湖大闸蟹，特指产于江苏省苏州市境内阳澄湖水域的中华绒螯蟹（Eriocheir sinensis），因其独特的生长环境和严格的品控标准而享有盛名。阳澄湖水质清澈，水草丰茂，底质硬结，天然饵料丰富，造就了其“青背、白肚、黄毛、金爪”的典型外观特征。阳澄湖大闸蟹以肉质细嫩、膏黄丰满、味道鲜美著称，通常于每年秋季性腺成熟时捕捞上市，是久负盛名的时令佳肴。地理标志产品保护制度已将其纳入保护范围，只有产自阳澄湖划定水域并符合相关标准的中华绒螯蟹，方可使用“阳澄湖大闸蟹”称谓。
