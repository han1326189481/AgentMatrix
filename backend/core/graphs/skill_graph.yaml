    description: '豆汁是北京及周边地区的一种传统发酵饮品，以绿豆为原料，经过烫豆、磨浆、分离淀粉、发酵等工序制成。其色泽灰绿，口感酸馊，带有独特的发酵气味，常趁热饮用，佐以咸菜丝或焦圈。豆汁的历史可追溯至辽金时期，明清时已见诸记载，曾是京城各阶层日常饮食的一部分。其制作关键在于利用自然乳酸菌和酵母菌进行复合发酵，形成特有的酸香风味。豆汁富含蛋白质、维生素C和膳食纤维，但因其特殊风味，接受人群较为有限。2008年，豆汁的制作技艺被列入国家级非物质文化遗产名录，成为北京饮食文化的重要符号。[来源:
