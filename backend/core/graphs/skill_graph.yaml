    description: '成本控制是指在企业生产经营过程中，按照既定的成本目标，对构成成本的各种耗费进行严格计算、调节和监督，及时发现偏差并采取纠正措施，使实际成本被限制在目标范围之内，以实现成本最优化的一项管理活动。它包括事前控制（如成本预测、决策和计划）、事中控制（如对成本形成过程的实时监控与调整）和事后控制（如成本核算、分析与考核）。成本控制并非一味压低开支，而是通过消除浪费、提高资源利用效率，在保证产品质量和经营需要的前提下，以最小的成本获取最大的经济效益，是企业成本管理的核心环节，对于增强企业竞争力、提高盈利水平具有重要意义。[来源:
      现代企业管理学教材]'
    domain: business.planning
    id: 成本控制
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:12:51'
      audited: true
    name: 成本控制
    node_type: concept
  成本效益评估:
    aliases:
    - Cost-Benefit Analysis
    - 成本效益分析
    - CBA
    description: '成本效益评估是一种系统化的经济决策分析方法，通过对特定项目、政策或行动的全部预期成本与全部预期效益进行识别、量化和比较，以判定其经济可行性或优选方案。该评估要求将不同时间点的成本与效益按适当折现率折算为现值，常以效益成本比率（总效益现值除以总成本现值）、净现值（效益现值减去成本现值）或内部收益率等指标作为评判依据。当净现值为正或效益成本比大于一时，通常认为方案具有经济合理性。该方法广泛应用于公共投资评估、政府管制影响分析、企业管理决策及卫生经济学等领域，旨在将稀缺资源配置于净社会效益最大的用途。在实践中，成本与效益既包括可直接用货币衡量的财务层面，也需尽可能纳入外部性、非市场价值等社会经济影响。
      [来源: 百度百科/《工程项目经济评价方法与参数》]'
    domain: business.report
    id: 成本效益评估
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:12:53'
      audited: true
    name: 成本效益评估
    node_type: concept
  成本风险:
    aliases:
    - Cost Risk
    - 费用风险
    - Financial Risk
    description: '成本风险是指在项目、运营或投资过程中，因各种不确定因素导致实际成本偏离预算或预期成本的可能性及由此带来的损失幅度。这种风险通常源于资源价格波动、估算不准确、范围变更、技术复杂度、供应链中断或宏观经济环境变化等，表现为成本超支或资金使用效率降低。成本风险是风险管理中的重要类别，贯穿于规划、执行与监控的全过程，其量化常借助敏感性分析、蒙特卡洛模拟或历史数据建模，以评估对项目可行性与财务目标的潜在冲击。有效的成本风险管理需通过严谨的估算、预留应急储备、合同条款设计及持续监控等手段予以应对。
      [来源: Project Management Body of Knowledge (PMBOK Guide)]'
    domain: business.planning
    id: 成本风险
    metadata:
      audit_source: deepseek
