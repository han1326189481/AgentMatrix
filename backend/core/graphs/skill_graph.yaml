  弹性伸缩:
    aliases:
    - Auto Scaling
    - 弹性扩展
    - Elastic Scaling
    description: '弹性伸缩（Auto Scaling）是一种云计算服务，能够根据业务负载变化和预设的伸缩策略，自动调整计算资源（如虚拟机实例、容器等）的数量。当业务需求上升时，弹性伸缩自动增加资源以保证服务性能与可用性；当需求下降时，自动减少资源以节约成本，从而实现资源供给与业务压力的实时匹配。该服务常与负载均衡、监控告警等服务配合使用，支持定时伸缩、动态伸缩、预测伸缩等多种模式，适用于电商大促、流量突发、周期性作业等场景。通过定义伸缩组、伸缩配置和伸缩规则，用户无需人工干预即可实现资源的弹性管理。弹性伸缩是云原生架构下实现高可用、高弹性、低成本的关键能力之一。


      [来源: 百度百科]'
