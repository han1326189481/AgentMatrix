  球变暖的主要原因:
    aliases: []
    description: '全球变暖的主要原因是指造成地球气候系统长期增温的主导因素。当前科学共识表明，自20世纪中期以来的全球变暖极有可能由人类活动引起，其中人为温室气体排放是最关键的驱动力。人类燃烧化石燃料（煤、石油、天然气）、进行工业生产、改变土地利用（如毁林）等活动，向大气释放大量二氧化碳、甲烷、氧化亚氮等温室气体，显著增强了大气的自然温室效应，导致地表温度上升。自然因素（如太阳辐射变化、火山活动）虽对气候有影响，但不足以解释近几十年来的快速升温趋势。政府间气候变化专门委员会（IPCC）评估报告指出，1951年至2010年观测到的全球平均地表温度升高中，人为强迫的贡献率超过一半。因此，当前全球变暖的主要原因被认定为由人类活动导致的温室气体浓度增加。
      [来源: IPCC第五次评估报告]'
    domain: tech.ai.agent.memory
    id: 球变暖的主要原因
    metadata:
      audit_source: deepseek
      audit_time: '2026-07-30T12:26:11'
      audited: true
    name: 球变暖的主要原因
    node_type: concept
  生煎包:
