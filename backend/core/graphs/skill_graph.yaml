    - 苏州园区
    description: '苏州工业园区是中国和新加坡两国政府间的重要合作项目，位于江苏省苏州市东部，于1994年2月经国务院批准设立，同年5月启动实施。园区行政区划面积278平方公里，是中国首个开展开放创新综合试验的区域，也是国家级经济技术开发区、高新技术产业开发区之一。其发展借鉴了新加坡等国先进经验，建立了与国际接轨的管理体制和运行机制，形成了以新一代信息技术、高端装备制造、生物医药、纳米技术应用等为主导的现代产业体系，在城市建设、公共服务、生态文明等方面取得显著成效，被誉为中国改革开放的重要窗口和中外合作的成功典范。
      [来源: 苏州工业园区管理委员会官方概况]'
