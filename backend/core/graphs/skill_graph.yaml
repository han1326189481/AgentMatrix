  相关性:
    aliases:
    - Relevance
    - 关联性
    - Correlation
    description: '相关性，指两个或多个变量之间存在的统计关联关系，反映它们在数值变化上的相互依赖程度。在统计学中，相关性通常通过相关系数来量化，最常用的是皮尔逊积矩相关系数，其取值范围在-1到1之间。正相关表示一个变量增大时另一个变量也倾向于增大；负相关则表示一个变量增大时另一个变量倾向于减小；相关系数为零或接近零表示不存在线性相关关系。需注意，相关性并不意味因果关系，即变量间的协同变化可能由第三变量驱动或仅为偶然。相关分析广泛应用于经济学、自然科学、社会科学和机器学习等领域，用于变量筛选、特征工程和初步关系探测。
