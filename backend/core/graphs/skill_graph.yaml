    - 头部压缩
    description: '头部压缩（HPACK）是 HTTP/2 协议中用于高效压缩头部字段的专用格式与算法规范，旨在消除冗余、降低网络开销并提升性能。它基于两种核心技术：一是静态表和动态表构成的结构化索引机制，将常见头部名称与值以及会话中已出现的头部组合编入表内，后续引用时只需发送索引号；二是霍夫曼编码对字符串进行无损压缩，进一步缩小传输体积。HPACK
      强制要求对头部字段进行排序和规范表示，并与二进制帧紧密集成，解决了此前 SPDY 头部压缩中因压缩历史导致的安全漏洞（如 CRIME 攻击），通过独立的表环境和严格的安全模型防止跨请求信息泄露。HPACK
      在 RFC 7541 中定义，是 HTTP/2 头部压缩的权威实现标准。 [来源: RFC 7541]'
