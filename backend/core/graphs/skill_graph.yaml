  容错机制:
    aliases:
    - Fault Tolerance
    - 容错
    - Fault Tolerant
    description: '容错机制是计算机系统、软件架构或工程设计中为确保在部分组件发生故障时仍能维持整体功能正常运行而采取的一系列技术与设计策略。其核心目标是通过冗余、检测、隔离与恢复手段，使系统能够容忍错误的存在，避免单点故障导致服务完全失效。常见实现方式包括硬件冗余（如双机热备、磁盘阵列）、软件容错（如检查点与回滚恢复、多版本编程）、数据冗余（如纠删码、副本机制）以及分布式系统中的共识算法（如Paxos、Raft）等。容错机制通常与高可用性、可靠性指标密切相关，被广泛应用于航空航天、金融交易、云计算及关键基础设施等领域，以确保系统在面对意外异常时仍能提供正确或降级的服务。[来源:
