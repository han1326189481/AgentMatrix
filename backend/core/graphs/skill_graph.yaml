    description: 蟹壳黄是一种中国传统特色茶点，因成品色泽金黄、形似煮熟的螃蟹壳而得名。它以发酵面团包裹油酥，经反复擀卷形成层次，再包入甜或咸馅料，表面刷饴糖、撒芝麻后烘烤而成。成品外观饱满，底部微焦，入口酥松香脆，有明显的芝麻香与馅料风味。甜馅常用白糖、豆沙、枣泥等，咸馅则以葱油、鲜肉、萝卜丝为主，其中葱油咸味最为经典。蟹壳黄起源于江浙沪一带，尤以上海的最为知名，早期多见于茶馆、老虎灶旁的点心摊，后逐渐发展为广受欢迎的街头小吃与传统名点，至今仍是苏式糕点中的重要品种。[来源：百度百科]
