  流_id_机制:
    aliases:
    - Stream ID
    - 流标识符
    - Stream ID Mechanism
    description: '**流 ID 机制**（Stream Identifier Mechanism）是指在支持多路复用的通信协议中，为每个独立的逻辑数据流分配唯一整数标识符，并依据该标识符对流的生命周期、帧调度、优先级及流量控制进行管理的标准化方法。该机制通常规定流
      ID 由发起方按序递增分配，其中客户端发起的流使用奇数编号，服务端发起的流使用偶数编号，且流 ID 一经使用不可在该连接内重复分配。以 HTTP/2 和
      QUIC 协议为例，流 ID 0 保留用于连接控制消息，空闲流、已关闭流与新流通过 ID 状态严格区分，从而实现在单一 TCP 或 UDP 连接上并发交错传输数据帧而不产生队头阻塞。该机制是协议层实现高效并发与可靠传输的关键设计。
      [来源: RFC 7540 (HTTP/2), RFC 9000 (QUIC)]'
    domain: tech.network
    id: 流_id_机制
