    description: '毕业时间是指受教育者在教育机构修完教学计划规定的全部课程，成绩合格或修满规定学分，经学校审核批准准予毕业，并在毕业证书上正式记载的日期。该日期标志着学生与学校之间正式教育关系的终结，以及相应学历层次学习阶段的完结。毕业时间通常由学校的学期安排和学制决定，常见于每年的六月或七月，部分院校也设冬季毕业批次。在升学、就业、人事档案管理及学历认证中，毕业时间是核定学历取得节点的重要依据，具有法定凭证效力。
