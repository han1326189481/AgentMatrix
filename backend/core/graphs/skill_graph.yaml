  注意力机制:
    aliases:
    - Attention Mechanism
    - Attention
    - 注意力
    description: '注意力机制是一种模拟人类认知中信息筛选过程的计算技术，广泛应用于深度学习领域。其核心思想是让模型在处理输入序列时，能够动态地给不同部分分配不同的权重，使得重要信息获得更多关注，无关信息被忽略或抑制。在机器翻译等序列到序列任务中，传统编码器-解码器结构仅使用固定的上下文向量，难以捕捉长序列依赖；注意力机制通过计算解码器当前状态与编码器所有隐藏状态的匹配程度，生成一组注意力分数，经过归一化后得到上下文向量，从而让解码器在每一步都有选择地聚焦于源序列的相关部分。该机制可显著提升模型性能，并衍生出自注意力、多头注意力等变体，成为Transformer等现代架构的基础模块。


      [来源: Vaswani et al., "Attention Is All You Need", 2017; 深度学习教科书《Deep Learning》,
      Goodfellow et al.]'
