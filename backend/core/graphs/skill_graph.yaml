    description: 'ClusterIP 是 Kubernetes 中 Service 的一种默认类型，用于在集群内部提供一个仅可由集群内其他 Pod
      或服务访问的虚拟 IP 地址。该 IP 由 kube-proxy 根据集群的 Service 网段自动分配，或由用户指定（须在合法范围内）。ClusterIP
      服务将流量依据目标端口映射到一个或多个后端 Pod 上，通过标签选择器进行关联，从而实现服务发现与简单的负载均衡。它本身不对外部网络暴露，外部客户端无法直接通过
      ClusterIP 访问服务，适用于内部微服务之间的通信场景。其生命周期与对应 Service 对象绑定，一旦 Service 被删除，ClusterIP
