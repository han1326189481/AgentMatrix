capabilities:
- markdown
- text_generation
- question_answering
forbidden:
- 禁止对简单问候使用标题、大纲等结构化格式
- 禁止对日常对话进行深度分析
knowledge:
  confidence: 0.95
  constraints:
  - 回复简短友好，1-3句话即可
  - 像真人对话，不要使用模板化结构
  - 不要对简单问候展开长篇大论
  examples:
  - query: 你好
    response_structure: 你好！有什么我可以帮你的吗？
  - query: 今天天气怎么样？
    response_structure: 今天天气不错，适合出门活动～
  keywords:
    primary:
      天气:
      - 天气
      - 气温
      - 下雨
      - 晴天
      - 阴天
      时间:
      - 几点
      - 日期
      - 星期
      - 今天
      - 明天
      身份:
      - 你是谁
      - 你叫什么
      - 自我介绍
      - 你的名字
      问候:
      - 你好
      - 您好
      - hi
      - hello
      - 嗨
      - 早上好
      - 下午好
      - 晚上好
    secondary:
    - - 谢谢
      - 再见
      - 好的
      - 嗯
      - 哦
  ontology:
    concepts: []
