    professional: 0.25
    completeness: 0.15
    reasoning: 0.10
    structure: 0.10
    actionable: 0.10
  pass_threshold: 0.65
  difficulty_matrix:
    tech:
      tool_basic: { min: 0.30, max: 0.50 }
      tool_advanced: { min: 0.50, max: 0.75 }