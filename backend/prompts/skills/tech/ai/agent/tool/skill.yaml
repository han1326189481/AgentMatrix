      - term: "Function Calling"
        definition: "LLM调用预定义函数/工具的能力，通过JSON Schema定义接口"
        related: ["工具调用", "API集成", "参数定义", "类型约束"]
      - term: "Tool Use"
        definition: "Agent自主选择和使用工具完成任务的机制"
        related: ["工具选择", "错误处理", "结果解析"]

  constraints:
