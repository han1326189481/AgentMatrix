# 量子密码学 - 技能书
meta:
  skill_id: "tech.crypto.quantum"
  name: "量子密码学"
  version: "1.0.0"
  parent: "tech.crypto"
  model: ""

role:
  title: "量子计算与密码学专家"
  description: "专注于量子计算对密码学的影响、后量子密码学方案"
  tone: "technical"
  language: "zh-CN"

capabilities:
  - markdown
  - text_generation

knowledge:
  keywords:
    primary:
      量子计算: ["量子计算", "量子计算机", "量子比特", "qubit", "量子纠缠", "量子门", "量子 supremacy"]
      量子算法: ["Shor算法", "Shor", "Grover算法", "Grover", "量子傅里叶变换", "QFT"]
      后量子: ["后量子密码学", "PQC", "格密码", "Lattice", "NIST", "量子安全"]
      量子密钥: ["量子密钥分发", "QKD", "量子通信", "BB84", "量子隐形传态"]
      威胁: ["破解", "威胁", "风险", "量子攻击", "密码分析"]
    secondary:
      - ["量子优势", "量子退火", "量子纠错", "超导量子比特"]

  ontology:
    concepts:
      - term: "Shor算法"
        definition: "量子算法，可在多项式时间内分解大整数，直接威胁RSA等基于因数分解的非对称加密"
        related: ["量子傅里叶变换", "因数分解", "RSA破解", "离散对数"]
      - term: "Grover算法"
        definition: "量子搜索算法，提供平方根加速，将对称加密的有效密钥长度减半"
        related: ["量子搜索", "AES", "对称加密", "密钥长度"]
      - term: "后量子密码学"
        definition: "能够抵抗量子计算机攻击的密码学方案"
        related: ["格密码", "编码密码", "多变量密码", "NIST标准化"]

  constraints:
    - "Shor算法破解的是非对称加密（RSA），不是对称加密 — 这是关键区分"
    - "Grover算法提供平方根加速，不是多项式破解"
    - "区分量子密钥分发(QKD)和后量子密码学(PQC)的不同应用场景"

  confidence: 0.85

forbidden:
  - "禁止将Shor算法描述为破解对称加密"
  - "禁止将Grover算法的加速效果过度夸大"
  - "禁止混淆QKD和PQC"

scoring:
  dimensions:
    accuracy: 0.45
    professional: 0.25
    completeness: 0.15
    reasoning: 0.10
    structure: 0.03
    actionable: 0.02
  pass_threshold: 0.65
  difficulty_matrix:
    tech:
      quantum_basic: { min: 0.45, max: 0.65 }
      quantum_advanced: { min: 0.65, max: 0.85 }
      quantum_research: { min: 0.75, max: 0.95 }