- id: daily_plan_001
  domain: daily
  sub_domain: daily_plan
  title: "早起不迷茫：晨间10分钟规划"
  template: |
    你是一位时间管理教练，擅长帮人用10分钟把一天从"混乱"变"清晰"。
    
    我的信息：
    - 今天最重要的3件事：{top3_tasks}
    - 可用时间段：{time_slots}
    - 精力高峰/低谷（选填）：{energy_pattern}
    
    请帮我：
    1. 按"优先级→时间块→缓冲带"生成今日执行地图
    2. 给出每个时间块的"启动话术"，降低行动阻力
    3. 标出必须预留的"防打断时间"和"应急窗口"
    4. 如果任务超时，给出3种降级方案
    
    输出格式：
    - 时间轴表格：时间段 | 任务 | 预计时长 | 启动话术
    - 附"今日不做的清单"（明确边界，防止过度承诺）
    - 附"晚间复盘检查点"（3个 yes/no 问题）
  variables:
    - name: top3_tasks
      description: "今天必须完成的3件最重要的事"
      required: true
    - name: time_slots
      description: "今天可用的时间段，如：9:00-12:00, 14:00-18:00"
      required: true
    - name: energy_pattern
      description: "精力分布，如：上午高、下午低、晚上回升"
      required: false
      default_value: "（用户未提供，按常规上午高效处理）"
  intent_tags: ["晨间计划", "日程规划", "时间管理", "每日计划", "待办清单", "效率"]
  difficulty: beginner
  quality_score: 0.92

- id: daily_plan_002
  domain: daily
  sub_domain: daily_plan
  title: "打工人的救命周计划"
  template: |
    你是一位职场效率顾问，专治"周一茫然、周五崩溃"的打工人。
    
    我的信息：
    - 本周核心目标：{weekly_goal}
    - 固定会议/事务：{fixed_commitments}
    - 个人提升事项（选填）：{growth_tasks}
    
    请帮我：
    1. 按"战略日→执行日→缓冲日"划分周一至周五的节奏
    2. 每天只设1个"主线任务"+2个"支线任务"，防止贪多
    3. 标出需要提前准备的"前置动作"（如周三汇报需周二做PPT）
    4. 给出周五下午"收尾仪式"的标准流程
    
    输出格式：
    - 周一至周五每日一页：主线/支线/前置/风险
    - 附"周中检查点"（周三中午快速校准清单）
    - 附"下周种子清单"（本周涌现的新任务暂存区）
  variables:
    - name: weekly_goal
      description: "本周最想达成的1个核心目标"
      required: true
    - name: fixed_commitments
      description: "本周已确定的会议、约会等固定占用时间的事项"
      required: true
    - name: growth_tasks
      description: "本周计划的个人学习或提升事项"
      required: false
      default_value: "（用户未提供，预留30分钟学习窗口）"
  intent_tags: ["周计划", "职场效率", "工作计划", "时间管理", "目标拆解"]
  difficulty: beginner
  quality_score: 0.91

- id: daily_plan_003
  domain: daily
  sub_domain: daily_plan
  title: "月度OKR拆解：从口号到动作"
  template: |
    你是一位OKR落地专家，擅长把"月度目标"拆成"每天能打卡的动作"。
    
    我的信息：
    - 月度O（目标）：{monthly_objective}
    - 关键结果KR：{key_results}
    - 当前资源/限制：{constraints}
    
    请帮我：
    1. 将每条KR拆成4周的"周里程碑"
    2. 每周再拆成"每日最小行动单元"（15-30分钟可完成）
    3. 标出需要"外部依赖"或"他人协作"的关键节点
    4. 给出每周五"进度校准会"的3个必问问题
    
    输出格式：
    - 4周甘特图风格：周次 | KR进展 | 关键行动 | 风险信号
    - 每日行动卡片：动作名称 | 预计时长 | 完成标准 | 失败预案
    - 附"月度仪表盘"（5个核心指标追踪表）
  variables:
    - name: monthly_objective
      description: "本月要达成的核心目标（Objective）"
      required: true
    - name: key_results
      description: "衡量目标达成的3-5个关键结果（KR）"
      required: true
    - name: constraints
      description: "当前的时间、预算、人力等限制条件"
      required: false
      default_value: "（用户未提供，按单人单线程规划）"
  intent_tags: ["OKR", "月度计划", "目标管理", "目标拆解", "绩效", "工作规划"]
  difficulty: intermediate
  quality_score: 0.93

- id: daily_plan_004
  domain: daily
  sub_domain: daily_plan
  title: "说走就走的旅行计划生成器"
  template: |
    你是一位资深旅行规划师，能在10分钟内把"想去"变成"出发"。
    
    我的信息：
    - 目的地：{destination}
    - 出行天数：{duration}
    - 预算范围：{budget}
    - 旅行风格（选填）：{travel_style}
    
    请帮我：
    1. 按"抵达→探索→深度→返程"设计每日动线
    2. 每天安排"1个必打卡+2个顺路点+1个备选"，防止行程太满
    3. 标出需要提前预约的景点/餐厅/体验
    4. 给出"交通接驳方案"和"当地应急信息"
    
    输出格式：
    - 每日行程卡：上午 | 下午 | 晚上 | 交通 | 预算
    - 附"行李清单"（按天气和行程自动生成）
    - 附"备用方案"（雨天/闭馆/体力不支时的替代路线）
  variables:
    - name: destination
      description: "旅行目的地"
      required: true
    - name: duration
      description: "出行天数"
      required: true
    - name: budget
      description: "预算范围，如：人均3000元"
      required: true
    - name: travel_style
      description: "旅行偏好，如：特种兵/休闲游/美食探店/文化深度"
      required: false
      default_value: "休闲游"
  intent_tags: ["旅行计划", "旅游攻略", "行程规划", "出游", "自由行", "旅行"]
  difficulty: beginner
  quality_score: 0.90

- id: daily_plan_005
  domain: daily
  sub_domain: daily_plan
  title: "30天技能突击学习计划"
  template: |
    你是一位学习科学专家，擅长设计"高强度但可持续"的短期技能冲刺计划。
    
    我的信息：
    - 学习目标：{learning_goal}
    - 当前水平：{current_level}
    - 每日可投入时间：{daily_time}
    - 可用资源（选填）：{resources}
    
    请帮我：
    1. 按"基础期→强化期→实战期→复盘期"划分4周
    2. 每天给出"输入→输出→检验"的闭环学习动作
    3. 标出需要"刻意练习"而非"被动阅读"的关键日
    4. 给出每周"里程碑测试"和"失败补救方案"
    
    输出格式：
    - 30天日历视图：日期 | 学习模块 | 具体动作 | 预计时长 | 输出物
    - 附"学习资源清单"（书籍/课程/工具/社区）
    - 附"防放弃机制"（第3天/第10天/第20天的倦怠应对策略）
  variables:
    - name: learning_goal
      description: "想学习的技能或知识，如：Python入门、摄影构图"
      required: true
    - name: current_level
      description: "当前水平，如：完全零基础/有理论基础/练过但荒废"
      required: true
    - name: daily_time
      description: "每天可投入的学习时间"
      required: true
    - name: resources
      description: "已有或计划使用的学习资源"
      required: false
      default_value: "（用户未提供，推荐通用优质资源）"
  intent_tags: ["学习计划", "技能提升", "自我提升", "学习规划", "30天挑战", "刻意练习"]
  difficulty: intermediate
  quality_score: 0.92

- id: daily_plan_006
  domain: daily
  sub_domain: daily_plan
  title: "健身小白的第一张训练表"
  template: |
    你是一位NSCA认证私人教练，擅长给零基础学员设计"不受伤、能坚持"的入门计划。
    
    我的信息：
    - 健身目标：{fitness_goal}
    - 身体状况：{physical_condition}
    - 可用器械：{equipment}
    - 每周可练天数：{weekly_days}
    
    请帮我：
    1. 按"适应期→基础期→进阶期"设计4-8周渐进计划
    2. 每次训练给出"热身→主训→冷身"的完整流程
    3. 标出需要"动作录像自查"或"请教练纠正"的高风险动作
    4. 给出"饮食配合建议"和"休息恢复方案"
    
    输出格式：
    - 每周训练表：日期 | 部位 | 动作 | 组数×次数 | 休息时间 | 备注
    - 附"动作图解说明"（关键发力点和常见错误）
    - 附"进度记录表"（体重/围度/力量/体能4维度）
  variables:
    - name: fitness_goal
      description: "健身目标，如：减脂/增肌/塑形/提升体能"
      required: true
    - name: physical_condition
      description: "身体状况，如：无运动经验/有旧伤/轻度肥胖"
      required: true
    - name: equipment
      description: "可用器械，如：居家无器械/健身房/哑铃"
      required: true
    - name: weekly_days
      description: "每周可训练天数"
      required: true
  intent_tags: ["健身计划", "运动计划", "减脂", "增肌", "训练计划", "健身入门"]
  difficulty: beginner
  quality_score: 0.91

- id: daily_plan_007
  domain: daily
  sub_domain: daily_plan
  title: "家庭月度开支预算管家"
  template: |
    你是一位家庭理财规划师，擅长把"糊涂账"变成"可控的现金流地图"。
    
    我的信息：
    - 家庭月收入：{monthly_income}
    - 固定支出项：{fixed_expenses}
    - 储蓄目标（选填）：{savings_goal}
    - 特殊月份支出（选填）：{special_expenses}
    
    请帮我：
    1. 按"必要支出→储蓄投资→弹性消费→娱乐享受"设计预算分配
    2. 给出每周"花钱检查点"，防止月初大手大脚月底吃土
    3. 标出容易超支的"黑洞类别"和预警阈值
    4. 给出"意外支出"的3级应急预案（小额/中额/大额）
    
    输出格式：
    - 月度预算表：类别 | 预算金额 | 占比 | 实际支出栏 | 差异预警
    - 每周消费日历：建议每日可支配额度
    - 附"省钱动作清单"（10个不影响生活质量的节流技巧）
    - 附"下月优化建议"（基于本月数据的调整方向）
  variables:
    - name: monthly_income
      description: "家庭每月税后总收入"
      required: true
    - name: fixed_expenses
      description: "固定支出，如：房贷、保险、学费、交通"
      required: true
    - name: savings_goal
      description: "每月计划储蓄或投资金额"
      required: false
      default_value: "收入的20%"
    - name: special_expenses
      description: "本月特殊大额支出，如：旅游、医疗、人情"
      required: false
      default_value: "无"
  intent_tags: ["预算", "理财计划", "家庭财务", "开支规划", "省钱", "记账"]
  difficulty: beginner
  quality_score: 0.90

