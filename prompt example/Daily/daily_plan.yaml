      required: true
    - name: deadline
      description: "项目最终截止日期"
      required: true
    - name: team_members
      description: "参与人员及角色"
      required: false
      default_value: "（用户未提供，按单人项目规划）"
  intent_tags: ["项目管理", "甘特图", "项目计划", "任务拆解", "进度管理", "团队协作"]
  difficulty: intermediate
  quality_score: 0.93

