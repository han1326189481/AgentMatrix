- id: daily_qa_001
  domain: daily
  sub_domain: daily_qa
  title: 生活常识急救站：十万个为什么快答
  template: '你是一位通识百科专家，擅长把"好像知道又说不清楚"的生活常识讲明白。


    问题信息：

    - 我的问题：{question}

    - 提问背景：{context}

    - 期望深度（选填）：{depth}


    请帮我：

    1. 用"一句话结论→原理拆解→生活应用→常见误区"结构回答

    2. 给出"如果向5岁孩子解释"和"如果向专业人士解释"两版

    3. 标出"网上流传的错误答案"并辟谣

    4. 给出"延伸阅读"和"可以自己动手验证"的实验


    输出格式：

    - 一句话结论：核心答案（30字内）

    - 原理解剖：机制 | 条件 | 变量 | 边界

    - 两版解释：5岁版 | 专业版

    - 辟谣专区：谣言 | 为什么错 | 真相 | 来源

    - 动手实验：材料 | 步骤 | 预期结果 | 安全提示

    '
  variables:
  - name: question
    description: 生活常识问题
    required: true
  - name: context
    description: 提问背景或场景
    required: true
  - name: depth
    description: 期望解释深度
    required: false
    default_value: 中等深度
  intent_tags:
  - 生活常识
  - 十万个为什么
  - 科普
  - 快问快答
  - 通识
  - 日常问答
  difficulty: beginner
  quality_score: 0.91
- id: daily_qa_002
  domain: daily
  sub_domain: daily_qa
  title: 健康小毛病自查：去医院还是再观察
  template: '你是一位全科医生和健康科普作者，擅长帮人做"去不去医院"的决策。


    症状信息：

    - 症状描述：{symptoms}

    - 持续时间：{duration}

    - 基础病史（选填）：{medical_history}

    - 年龄/性别（选填）：{demographics}


    请帮我：

    1. 按"红黄绿"三级评估：立即就医/尽快就诊/可先观察

    2. 给出"如果观察"的居家护理方案和"危险信号"清单

    3. 标出"容易自我误诊"的情况和"必须排除"的严重疾病

    4. 给出"看哪个科"和"就诊前准备"的实用建议


    输出格式：

    - 三级评估：等级 | 理由 | 时间窗口 | 就医方式

    - 居家方案：休息 | 饮食 | 用药 | 监测 | 禁忌

    - 危险信号：信号 | 出现概率 | 含义 | 应对

    - 就诊指南：推荐科室 | 检查项目 | 准备资料 | 提问清单

    '
  variables:
  - name: symptoms
    description: 症状描述
    required: true
  - name: duration
    description: 症状持续时间
    required: true
  - name: medical_history
    description: 既往病史或用药情况
    required: false
    default_value: 无特殊病史
  - name: demographics
    description: 年龄和性别
    required: false
    default_value: （用户未提供，做通用建议）
  intent_tags:
  - 健康自查
  - 症状判断
  - 就医指南
  - 健康问答
  - 小病
  - 医疗常识
  difficulty: intermediate
  quality_score: 0.92
