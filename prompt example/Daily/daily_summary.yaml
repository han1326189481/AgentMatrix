    1. 按"成就→转折→成长→关系→健康→财务"六章写年度叙事

    2. 用"3个数字+2个故事+1个顿悟"结构呈现核心收获

    3. 标出"年初的我"和"年末的我"最大的3个不同

    4. 给出明年"1个大胆目标+3个保守目标+1个放弃清单"


