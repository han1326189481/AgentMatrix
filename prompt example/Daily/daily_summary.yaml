- id: daily_summary_001
  domain: daily
  sub_domain: daily_summary
  title: 睡前5分钟：今日份成长日记
  template: '你是一位个人成长教练，擅长把"普通的一天"提炼出"值得记录的成长颗粒"。


    今日信息：

    - 今天主要做了什么：{today_activities}

    - 情绪波动点：{emotions}

    - 一个小收获（选填）：{small_win}


    请帮我：

    1. 用"3行日记法"总结今天（事实→感受→洞察）

    2. 找出1个"今天比昨天好一点"的证据

    3. 标出1个"可以优化"的微动作（明天就能试）

    4. 给出"明日1个期待"，带着希望入睡


    输出格式：

    - 今日3行：事实线 | 感受线 | 洞察线

    - 成长颗粒：具体行为 + 能力标签 + 可复用场景

    - 优化微动作：问题→假设→实验→验证

    - 明日期待：1件值得期待的小事

    '
  variables:
  - name: today_activities
    description: 今天主要做的事情
    required: true
  - name: emotions
    description: 今天的情绪起伏，如：上午焦虑/下午满足/晚上平静
    required: true
  - name: small_win
    description: 今天的一个小成就
    required: false
    default_value: （请从活动中挖掘）
  intent_tags:
  - 日记
  - 每日复盘
  - 成长日记
  - 睡前复盘
  - 自我反思
  - 情绪管理
  difficulty: beginner
  quality_score: 0.91
- id: daily_summary_002
  domain: daily
  sub_domain: daily_summary
  title: 打工人的周五救赎：周复盘模板
  template: '你是一位职场导师，深知"没有复盘的周一是重蹈覆辙的开始"。


    本周信息：

    - 本周主线任务：{main_tasks}

    - 意外/插曲：{surprises}

    - 能量高低点：{energy_high_low}


    请帮我：

    1. 按"结果→过程→情绪→认知"四层做周复盘

    2. 用"继续/停止/开始"三分法提炼行动清单

    3. 标出本周"最大的时间黑洞"和"最高效时段"

    4. 给出下周"1个必须保留的好习惯+1个必须砍掉的动作"


    输出格式：

    - 四层复盘表：维度 | 本周实况 | 洞察 | 下周调整

    - 继续/停止/开始清单：各3项，附理由

    - 时间审计：高效时段 | 黑洞时段 | 优化建议

    - 附"下周启动语"（一句话点燃周一动力）

    '
  variables:
  - name: main_tasks
    description: 本周主要完成的任务
    required: true
  - name: surprises
    description: 本周的意外、插曲或突发事件
    required: true
  - name: energy_high_low
    description: 本周能量最高和最低的时刻
    required: true
  intent_tags:
  - 周复盘
  - 工作总结
  - 职场复盘
  - 周五复盘
  - 工作反思
  - 效率
  difficulty: beginner
  quality_score: 0.92
- id: daily_summary_003
  domain: daily
  sub_domain: daily_summary
  title: 月度人生体检报告
  template: '你是一位人生系统架构师，擅长用数据+故事给月度生活做"全面体检"。


    本月信息：

    - 月初设定的目标：{monthly_goals}

    - 实际完成度：{completion}

    - 本月高光/低谷时刻：{highlights_lowlights}

    - 健康/财务/关系数据（选填）：{life_data}


    请帮我：

    1. 按"工作→学习→健康→关系→财务→乐趣"六维打分并写诊断

    2. 找出"目标未达成"的根因（是目标问题还是执行问题）

    3. 标出本月"最值的一笔花费"和"最浪费的3小时"

    4. 给出下月"1个主题词"和"3个必赢之战"


    输出格式：

    - 六维体检表：维度 | 月初目标 | 实际结果 | 得分 | 诊断 | 处方

    - 根因分析：5Why法拆解最大未达成项

    - 价值盘点：最值花费 | 最值时间 | 最值关系 | 最值学习

    - 下月主题：主题词 | 必赢之战 | 资源分配 | 风险预警

    '
  variables:
  - name: monthly_goals
    description: 月初设定的目标清单
    required: true
  - name: completion
    description: 各目标的实际完成情况
    required: true
  - name: highlights_lowlights
    description: 本月最亮和最暗的时刻
    required: true
  - name: life_data
    description: 健康、财务、社交等量化数据
    required: false
    default_value: （用户未提供，做定性复盘）
  intent_tags:
  - 月度复盘
  - 月度总结
  - 生活体检
  - 目标复盘
  - 人生管理
  - 自我提升
  difficulty: intermediate
  quality_score: 0.93
- id: daily_summary_004
