- id: ppt_academic_001
  domain: ppt
  sub_domain: ppt_academic
  title: "毕业答辩结构"
  template: |
    你是一位答辩委员会主席，深知什么样的答辩PPT能让老师少问刁钻问题。
    
    论文信息：
    - 论文题目：{thesis_title}
    - 研究方法：{methodology}
    - 创新点：{innovation}
    
    请帮我：
    1. 按"研究背景→问题→方法→实验→结论→致谢"设计标准答辩结构
    2. 标出老师最容易提问的3个页面及应对策略
    3. 给出每页的"演讲时间分配"（总时长15分钟）
    4. 设计一页"研究局限性"的诚恳表述（降低老师攻击性）
    
    输出格式：
    - 每页包含：标题、3个要点、演讲词（标红重点）、老师可能提问
    - 附"答辩时间分配表"和"致谢页"模板
    - 局限性页给出3种表述（保守/中性/坦诚）
  variables:
    - name: thesis_title
      description: "毕业论文题目"
      required: true
    - name: methodology
      description: "研究方法，如：问卷调查、实验、案例分析"
      required: true
    - name: innovation
      description: "论文创新点或贡献"
      required: true
  intent_tags: ["毕业答辩", "论文答辩", "答辩PPT", "毕业论文", "答辩稿", "开题", "学位论文"]
  difficulty: intermediate
  quality_score: 0.95

- id: ppt_academic_002
  domain: ppt
  sub_domain: ppt_academic
  title: "开题报告结构"
  template: |
    你是一位博士生导师，深知开题报告"不是展示成果，是证明思路可行"。
    
    课题信息：
    - 研究题目：{topic}
    - 研究意义：{significance}
    - 初步思路：{preliminary_idea}
    
    请帮我：
    1. 按"选题背景→文献综述→研究问题→研究方法→技术路线→预期成果→进度安排"设计结构
    2. 给出"让老师觉得选题有价值且可行"的话术
    3. 标出需要放技术路线图/研究框架/时间甘特图的位置
    4. 给出"创新点不足"和"可行性论证"的应对策略
    
    输出格式：
    - 每页包含：标题、核心内容、话术建议、图表提示
    - 附"开题禁忌"（题目太大、文献太少、方法不熟、时间不合理）
  variables:
    - name: topic
      description: "研究题目"
      required: true
    - name: significance
      description: "研究意义和价值"
      required: true
    - name: preliminary_idea
      description: "初步研究思路"
      required: false
      default_value: "（用户未提供，请预留思路页）"
  intent_tags: ["开题报告", "开题答辩", "课题申报", "研究计划", "开题PPT", "研究生", "选题"]
  difficulty: intermediate
  quality_score: 0.93

- id: ppt_academic_003
  domain: ppt
  sub_domain: ppt_academic
  title: "文献综述汇报"
  template: |
    你是一位文献综述专家，擅长把"读了一百篇论文"变成"一张清晰的地图"。
    
    综述信息：
    - 研究领域：{field}
    - 时间范围：{time_range}
    - 核心文献数量：{paper_count}
    
    请帮我：
    1. 按"领域概览→研究脉络→主流观点→争议焦点→研究空白→本文定位"设计结构
    2. 给出"不是罗列文献，而是讲清楚演进逻辑"的话术
    3. 标出需要放时间轴/分类矩阵/引用关系图的位置
    4. 给出"如何批评前人研究但不冒犯"的话术模板
    
    输出格式：
    - 每页包含：标题、综述要点、逻辑关系、关键文献
    - 附"文献综述禁忌"（罗列无分析、遗漏经典、引用错误、逻辑混乱）
  variables:
    - name: field
      description: "研究领域"
      required: true
    - name: time_range
      description: "文献时间范围，如：近5年、近10年"
      required: true
    - name: paper_count
      description: "核心文献数量"
      required: false
      default_value: "30篇左右"
  intent_tags: ["文献综述", "文献汇报", "研究综述", "文献梳理", "学术汇报", "综述PPT", "文献"]
  difficulty: advanced
  quality_score: 0.92

