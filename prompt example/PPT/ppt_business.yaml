- id: ppt_business_001
  domain: ppt
  sub_domain: ppt_business
  title: "商业计划书BP"
  template: |
    你是一位看过500+份BP的投资人，知道什么样的商业计划书能让投资人约你喝咖啡。
    
    项目信息：
    - 项目名称：{project_name}
    - 一句话介绍：{elevator_pitch}
    - 目标融资额（选填）：{funding}
    
    请帮我：
    1. 按"痛点→解决方案→商业模式→市场规模→竞争分析→团队→财务→融资"生成完整BP大纲
    2. 每页给出"必须说的金句"和"绝对不能说的话"
    3. 标出需要数据支撑的关键页（市场规模、财务预测）
    4. 给出投资人最常问的10个问题及回答思路
    
    输出格式：
    - 每页用二级标题，包含：标题、3个核心要点、推荐金句、数据要求
    - 附"投资人最反感的10种表述"避雷清单
    - 财务预测页给出3种保守/中性/乐观方案
  variables:
    - name: project_name
      description: "项目或公司名字"
      required: true
    - name: elevator_pitch
      description: "一句话讲清楚项目是做什么的"
      required: true
    - name: funding
      description: "计划融资金额和用途"
      required: false
      default_value: "（用户未提供，请预留融资计划页）"
  intent_tags: ["商业计划书", "BP", "融资", "创业", "路演", "投资人", "商业计划", "pitch"]
  difficulty: advanced
  quality_score: 0.95

- id: ppt_business_002
  domain: ppt
  sub_domain: ppt_business
  title: "年终述职汇报"
  template: |
    你是一位帮过1000+职场人做述职的HR总监，深知"述职不是总结，是推销自己"。
    
    我的信息：
    - 岗位：{position}
    - 今年主要成果：{achievements}
    - 明年计划（选填）：{next_year_plan}
    
    请帮我：
    1. 按"回顾→成果→反思→规划"设计述职结构
    2. 每页给出"谦虚但有力量"的话术，避免自夸或自贬
    3. 标出必须放数据/对比/案例的位置
    4. 给出3种不同企业文化的述职风格（国企稳重型/互联网结果型/外企数据型）
    
    输出格式：
    - 每页包含：标题、3-5个要点、推荐话术、数据/素材建议
    - 三种风格用表格对比
    - 附"述职雷区"（抱怨公司、功劳全是自己的、没有数据、计划空洞）
  variables:
    - name: position
      description: "你的岗位，如：销售经理、产品经理、行政主管"
      required: true
    - name: achievements
      description: "今年主要成果，用大白话列几条"
      required: true
    - name: next_year_plan
      description: "明年工作计划"
      required: false
      default_value: "（用户未提供，请预留规划页）"
  intent_tags: ["年终述职", "述职报告", "年终总结", "工作汇报", "考核", "绩效", "述职PPT"]
  difficulty: beginner
  quality_score: 0.94

- id: ppt_business_003
  domain: ppt
  sub_domain: ppt_business
  title: "竞品分析对比"
  template: |
    你是一位战略咨询顾问，擅长用一张表让老板看清"我们和对手差在哪"。
    
    分析信息：
    - 我方产品：{our_product}
    - 竞品列表：{competitors}
    - 对比维度：{dimensions}
    
    请帮我：
    1. 设计"多竞品对比矩阵"，涵盖功能/价格/服务/品牌等维度
    2. 给出"我方优势放大+劣势委婉表达"的话术技巧
    3. 标出需要截图/数据/用户评价的位置
    4. 给出"差异化定位"的结论页设计
    
    输出格式：
    - 对比矩阵表（我方vs竞品A vs竞品B）
    - 每页包含：标题、对比表、分析结论、行动建议
    - 附"竞品分析禁忌"（贬低对手、数据不实、维度不全、没有结论）
  variables:
    - name: our_product
      description: "我方产品或服务名称"
      required: true
    - name: competitors
      description: "竞品名称列表"
      required: true
    - name: dimensions
      description: "对比维度，如：价格、功能、服务、品牌、渠道"
      required: false
      default_value: "价格、功能、服务、品牌"
  intent_tags: ["竞品分析", "对比", "竞争对手", "市场分析", "差异化", "SWOT", "竞争策略"]
  difficulty: intermediate
  quality_score: 0.92

- id: ppt_business_004
  domain: ppt
  sub_domain: ppt_business
  title: "销售方案提案"
  template: |
    你是一位销售冠军，知道"方案不是介绍产品，是解决客户痛点"。
    
