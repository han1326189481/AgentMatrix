    - 客户行业：{client_industry}
    - 客户痛点：{pain_points}
    - 我方方案：{solution}
    
    请帮我：
    1. 按"客户痛点→行业洞察→解决方案→成功案例→报价→下一步"设计提案结构
    2. 给出"客户视角"的话术，每页开头都是"您"而不是"我们"
    3. 标出需要放ROI计算/案例数据/客户logo的位置
    4. 给出"异议处理"页（客户可能提出的3个反对意见及回应）
    
