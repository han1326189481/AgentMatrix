- id: ppt_data_chart_001
  domain: ppt
  sub_domain: ppt_data_chart
  title: "柱状图美化技巧"
  template: |
    你是一位数据可视化设计师，专治"柱状图长得跟Excel默认样式一样丑"的毛病。
    
    我的数据：
    - 数据内容：{data_description}
    - 对比维度：{dimensions}
    - 使用场景：{scene}
    
    请帮我：
    1. 给出3种柱状图美化方案（渐变柱/圆角柱/立体柱）
    2. 提供配色建议（主色+辅色+强调色）
    3. 给出"数据标签+坐标轴+网格线"的排版规范
    4. 提供"柱子太密/数据差异太大"的解决方案
    
    输出格式：
    - 3种方案的设计参数（颜色/圆角/间距/阴影）
    - 美化前后对比描述
    - 附"柱状图禁忌"（3D变形、颜色太多、没有数据标签、Y轴不从0开始）
  variables:
    - name: data_description
      description: "数据内容描述，如：2024年各季度销售额"
      required: true
    - name: dimensions
      description: "对比维度，如：时间、地区、产品"
      required: true
    - name: scene
      description: "使用场景"
      required: false
      default_value: "商务汇报"
  intent_tags: ["柱状图", "柱形图", "数据对比", "图表美化", "数据可视化", "统计图", "Excel图表"]
  difficulty: beginner
  quality_score: 0.91

- id: ppt_data_chart_002
  domain: ppt
  sub_domain: ppt_data_chart
  title: "饼图环形图优化"
  template: |
    你是一位信息图表设计师，知道饼图用不好就是"数据界的灾难"。
    
    我的数据：
    - 数据内容：{data_description}
    - 类别数量：{category_count}
    - 是否需要突出某一项：{highlight}
    
    请帮我：
    1. 给出"饼图vs环形图vs玫瑰图"的选择建议
    2. 提供配色方案（相邻色/对比色/单色系）
    3. 给出"标签放置+百分比显示+图例排版"的规范
    4. 提供"类别太多/比例太接近"的替代方案
    
    输出格式：
    - 3种图表类型的适用场景对比表
    - 配色和标签设计规范
    - 附"饼图禁忌"（类别超过6个、3D效果、颜色无区分、百分比不标注）
  variables:
    - name: data_description
      description: "数据内容，如：市场份额、预算分配、用户画像"
      required: true
    - name: category_count
      description: "类别数量"
      required: true
    - name: highlight
      description: "是否需要突出显示某一项"
      required: false
      default_value: "是"
  intent_tags: ["饼图", "环形图", "占比", "比例", "百分比", "数据分布", "玫瑰图"]
  difficulty: beginner
  quality_score: 0.90

- id: ppt_data_chart_003
  domain: ppt
  sub_domain: ppt_data_chart
  title: "折线图趋势展示"
  template: |
    你是一位趋势分析专家，擅长用折线图讲清楚"过去发生了什么，未来可能怎样"。
    
    我的数据：
    - 数据内容：{data_description}
    - 时间跨度：{time_span}
    - 是否需要预测：{need_forecast}
    
    请帮我：
    1. 给出3种折线图美化方案（平滑曲线/阶梯线/面积图）
    2. 提供"多线对比"的配色和线型区分（实线/虚线/点线）
    3. 给出"关键节点标注+趋势线+目标线"的设计规范
    4. 提供"数据波动大/数据点太多"的处理方案
    
    输出格式：
    - 3种方案的设计参数
    - 多线对比规范表
    - 附"折线图禁忌"（线条太细、颜色太接近、没有标注、Y轴截断误导）
  variables:
    - name: data_description
      description: "数据内容，如：月度销售额、网站流量、股价走势"
      required: true
    - name: time_span
      description: "时间跨度"
      required: true
    - name: need_forecast
      description: "是否需要展示预测趋势"
      required: false
      default_value: "否"
  intent_tags: ["折线图", "趋势", "趋势图", "走势", "时间序列", "预测", "数据趋势"]
  difficulty: beginner
  quality_score: 0.91

- id: ppt_data_chart_004
  domain: ppt
  sub_domain: ppt_data_chart
  title: "KPI仪表盘设计"
  template: |
    你是一位商业智能设计师，擅长把"一堆数字"变成"一眼就知道好坏"的仪表盘。
    
    我的需求：
    - KPI指标：{kpis}
    - 展示场景：{scene}
    - 更新频率：{update_freq}
    
    请帮我：
    1. 设计一套KPI仪表盘布局（大数字+进度条+趋势小图+红绿灯状态）
    2. 给出"正常/警告/危险"三色阈值设计
    3. 提供"6个以内KPI"和"6个以上KPI"的不同布局方案
    4. 给出"同比环比"的展示方式
    
    输出格式：
    - 仪表盘布局示意图（文字描述）
    - 配色和状态设计规范
    - 附"仪表盘禁忌"（数字太小、颜色含义混乱、信息过载、没有对比基准）
  variables:
    - name: kpis
      description: "KPI指标列表，如：销售额、转化率、客户满意度"
      required: true
    - name: scene
      description: "展示场景，如：管理层汇报、展厅大屏、日报"
      required: true
    - name: update_freq
      description: "更新频率，如：实时、每日、每周"
      required: false
      default_value: "每日"
  intent_tags: ["KPI", "仪表盘", "Dashboard", "关键指标", "数据看板", "业绩", "指标监控"]
  difficulty: intermediate
  quality_score: 0.92

- id: ppt_data_chart_005
