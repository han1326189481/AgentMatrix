- id: ppt_design_001
  domain: ppt
  sub_domain: ppt_design
  title: "商务蓝配色方案"
  template: |
    你是一位配色设计师，专治"PPT做得像Word"的朴素病。
    
    我的需求：
    - 使用场景：{scene}
    - 偏好色调（选填）：{color_pref}
    - 大概页数：{pages}页
    
    请帮我：
    1. 设计一套"商务蓝"主色调方案，给出主色/辅色/强调色的具体色值（RGB+十六进制）
    2. 为封面/目录/内容页/结尾页分别配色
    3. 给出字体搭配建议（标题字体+正文字体）
    4. 提供3种不同深浅的蓝色搭配，适配不同行业
    
    输出格式：
    - 用色块展示颜色，标注色值
    - 每页类型给出配色示例（文字+背景）
    - 附"配色禁忌"（哪些颜色不能和商务蓝一起用）
  variables:
    - name: scene
      description: "使用场景，如：年终汇报、投标、客户提案"
      required: true
    - name: color_pref
      description: "颜色偏好，如：偏深蓝、偏天蓝、偏灰蓝"
      required: false
      default_value: "（用户未指定，请提供标准商务蓝）"
    - name: pages
      description: "PPT页数"
      required: false
      default_value: "15"
  intent_tags: ["配色", "商务蓝", "PPT配色", "颜色搭配", "商务风", "专业", "蓝色", "色调"]
  difficulty: beginner
  quality_score: 0.90

