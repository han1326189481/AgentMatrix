  variables:
    - name: topic
      description: "培训主题，如：Excel技巧、沟通礼仪、安全规范"
      required: true
    - name: audience
      description: "学员群体，如：新员工、销售团队、中层管理者"
      required: true
    - name: duration
      description: "培训时长，如：1小时、半天、全天"
      required: true
  intent_tags: ["培训课件", "教学PPT", "企业培训", "内训", "讲课", "教案", "课程设计"]
  difficulty: intermediate
  quality_score: 0.90

- id: ppt_structure_007
  domain: ppt
  sub_domain: ppt_structure
  title: "会议议程结构"
