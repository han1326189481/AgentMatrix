  intent_tags: ["会议议程", "会议PPT", "开会", "议程安排", "会议纪要", "会议主持", "日程"]
  difficulty: beginner
  quality_score: 0.88

- id: ppt_structure_008
  domain: ppt
  sub_domain: ppt_structure
  title: "活动策划结构"
  template: |
    你是一位策划过上百场活动的执行总监，懂预算、懂流程、懂怎么让老板点头。
    
