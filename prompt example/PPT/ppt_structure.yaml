- id: ppt_structure_001
  domain: ppt
  sub_domain: ppt_structure
  title: "年终总结结构"
  template: |
    你是一位帮过上千个职场人做PPT的资深设计师，擅长把"不知道写什么"变成"领导看了直点头"的结构。
    
    我的PPT信息：
    - 岗位/身份：{role}
    - 今年主要干了什么：{achievements}
    - 大概页数：{pages}页（默认12页）
    
    请帮我：
    1. 设计一套完整的年终总结PPT大纲，每页写什么、写多少字
    2. 每页给出3-5个要点，告诉我放什么内容
    3. 标出哪些页需要数据/图表/照片
    4. 给每页配一句过渡语或金句
    
    输出格式：
    - 用Markdown二级标题表示每页（## 第N页：标题）
    - 每页包含：标题、要点（3-5条）、建议配图/数据、过渡语
    - 最后附"演讲时间分配建议"
  variables:
    - name: role
      description: "你的岗位或身份，如：销售主管、小学班主任、行政专员"
      required: true
    - name: achievements
      description: "今年完成的主要工作，用大白话列几条就行"
      required: true
    - name: pages
      description: "希望多少页，默认12页"
      required: false
      default_value: "12"
  intent_tags: ["年终总结", "年底汇报", "工作总结", "述职", "年终PPT", "考核", "帮我写总结", "年终报告"]
  difficulty: beginner
  quality_score: 0.93

- id: ppt_structure_002
  domain: ppt
  sub_domain: ppt_structure
  title: "项目汇报结构"
  template: |
    你是一位项目管理高手，专治"项目做了不少，汇报时却不知道怎么说"的毛病。
    
    我的项目信息：
    - 项目名称：{project_name}
    - 目前做到哪了：{progress}
    - 遇到了什么问题（选填）：{problems}
    
    请帮我：
    1. 按"背景→目标→进展→问题→下一步"设计PPT大纲
    2. 每页给出具体话术，我照着念就行
    3. 标出需要放截图/数据/时间轴的位置
    4. 给领导/客户看的版本和给团队看的版本各一版
    
    输出格式：
    - 分"汇报版"和"内部版"两套结构
    - 每页包含：标题、3-5个要点、建议放的素材
    - 用表格对比两版差异
  variables:
    - name: project_name
      description: "项目名字"
      required: true
    - name: progress
      description: "目前进展，比如：已完成80%，进入测试阶段"
      required: true
    - name: problems
      description: "遇到的困难或风险"
      required: false
      default_value: "（用户未提供，请预留问题分析页）"
  intent_tags: ["项目汇报", "进度汇报", "项目总结", "项目PPT", "汇报进度", "项目进展", "里程碑"]
  difficulty: beginner
  quality_score: 0.92

- id: ppt_structure_003
  domain: ppt
  sub_domain: ppt_structure
  title: "竞聘述职结构"
  template: |
    你是一位帮过500+人成功晋升的HR总监，深知竞聘PPT的"加分项"和"雷区"。
    
    我的竞聘信息：
    - 竞聘岗位：{target_position}
    - 我凭什么胜任：{advantages}
    - 过往业绩（选填）：{performance}
    
    请帮我：
    1. 设计"开场抓眼球→证明我能行→规划未来→收尾打动人"的完整结构
    2. 每页给出具体话术，要谦虚但有力量
    3. 标出必须放数据/证书/案例的位置
    4. 给3个不同风格的结尾（稳健型/进取型/感人型）
    
    输出格式：
    - 每页用二级标题，包含：标题、要点、推荐话术、素材建议
    - 三种结尾单独列出
    - 附"竞聘演讲时间分配表"
  variables:
    - name: target_position
      description: "想竞聘的岗位，如：部门经理、项目经理、教研组长"
      required: true
    - name: advantages
      description: "你的核心优势，大白话就行"
      required: true
    - name: performance
      description: "过往亮眼成绩"
      required: false
      default_value: "（用户未提供，请预留业绩展示页）"
  intent_tags: ["竞聘", "述职", "岗位竞聘", "晋升答辩", "竞聘演讲", "提拔", "竞选", "升职"]
  difficulty: intermediate
  quality_score: 0.94

- id: ppt_structure_004
  domain: ppt
  sub_domain: ppt_structure
  title: "创业路演结构"
  template: |
    你是一位看过1000+份BP的投资人，知道什么样的路演PPT能让投资人眼前一亮。
    
    我的项目信息：
    - 项目名称：{project_name}
    - 做什么的（一句话）：{elevator_pitch}
    - 需要融多少钱（选填）：{funding}
    
    请帮我：
    1. 按投资人思维设计"痛点→解决方案→商业模式→团队→融资"结构
    2. 每页给出"必须说的金句"和"绝对不能说的话"
    3. 标出需要数据支撑的关键页
    4. 设计Q&A环节可能遇到的5个问题及回答思路
    
    输出格式：
    - 每页包含：标题、3个核心要点、推荐金句、数据要求
    - 附"投资人最反感的10种表述"避雷清单
    - Q&A预案单独成节
  variables:
    - name: project_name
      description: "项目或公司名字"
      required: true
    - name: elevator_pitch
      description: "一句话描述项目是做什么的"
      required: true
    - name: funding
      description: "融资金额和用途"
      required: false
      default_value: "（用户未提供，请预留融资计划页）"
  intent_tags: ["创业路演", "BP", "融资PPT", "商业计划", "投资人", "路演", "创业大赛", " pitch"]
  difficulty: advanced
  quality_score: 0.93

- id: ppt_structure_005
  domain: ppt
  sub_domain: ppt_structure
  title: "产品发布结构"
  template: |
    你是一位策划过苹果、小米级发布会的PPT导演，懂得"悬念→高潮→行动"的节奏。
    
    产品信息：
    - 产品名称：{product_name}
    - 目标用户是谁：{target_users}
    - 最亮眼的3个功能：{key_features}
    
    请帮我：
    1. 设计"预热→痛点→产品亮相→功能详解→价格→行动号召"的发布结构
    2. 每页给出"台上怎么说"和"PPT上怎么放"
    3. 标出需要Demo视频/动效/实物图的位置
    4. 设计一个让人记住的"一句话口号"
    
    输出格式：
    - 分"演讲脚本"和"PPT页面内容"两栏对照
    - 每页包含：标题、演讲词（100字内）、PPT视觉建议
    - 最后附"发布会节奏时间表"
  variables:
    - name: product_name
      description: "产品名字"
      required: true
    - name: target_users
      description: "目标用户群体"
      required: true
    - name: key_features
      description: "最核心的3个功能或卖点"
      required: true
  intent_tags: ["产品发布", "发布会", "新品上市", "产品介绍", "产品推广", "路演", "宣讲"]
  difficulty: intermediate
  quality_score: 0.91

- id: ppt_structure_006
  domain: ppt
  sub_domain: ppt_structure
  title: "培训课件结构"
  template: |
    你是一位企业内训师，擅长把枯燥的知识变成"学员不想玩手机"的互动课件。
    
    培训信息：
    - 培训主题：{topic}
    - 学员是谁：{audience}
    - 培训时长：{duration}
    
    请帮我：
    1. 按"开场破冰→知识输入→互动练习→总结收尾"设计课件结构
    2. 每页给出讲师话术和学员互动环节
    3. 每20分钟设计一个"提神互动"（提问/小测验/案例讨论）
    4. 给出课后作业或行动清单
    
    输出格式：
    - 每页包含：标题、讲师话术（标红重点）、互动设计、时间分配
    - 用表格列出"学员易走神的时间点及应对策略"
