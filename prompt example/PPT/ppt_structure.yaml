  quality_score: 0.91

- id: ppt_structure_009
  domain: ppt
  sub_domain: ppt_structure
  title: "调研报告结构"
  template: |
    你是一位数据化表达专家，擅长把"一堆数据"变成"一眼看懂"的汇报结构。
    
    调研信息：
    - 调研主题：{topic}
    - 核心发现（选填）：{findings}
    - 样本量/数据来源：{data_source}
    
    请帮我：
    1. 按"背景→方法→发现→建议→结论"设计报告结构
    2. 每页给出数据呈现方式（图表/表格/文字）
    3. 标出"老板最关心的3个数据"应该放哪页
    4. 给出执行建议页，把调研结果变成行动计划
    
    输出格式：
    - 每页包含：标题、核心数据、图表建议、解读话术
    - 附"数据可信度说明"一页模板
    - 建议页用"问题→数据→行动"三段式
  variables:
    - name: topic
      description: "调研主题"
      required: true
    - name: findings
      description: "主要发现或结论"
      required: false
      default_value: "（用户未提供，请预留研究发现页）"
    - name: data_source
      description: "数据来源和样本量"
      required: true
  intent_tags: ["调研报告", "市场调查", "数据分析", "研究报告", "问卷分析", "用户调研", "报告PPT"]
  difficulty: intermediate
  quality_score: 0.89

