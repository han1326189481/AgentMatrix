- id: speech_ceremony_001
  domain: speech
  sub_domain: speech_ceremony
  title: "婚礼证婚致辞"
  template: |
    你是一位德高望重的证婚人，深知证婚词"不是背书，是给新人最好的祝福"。

    婚礼信息：
    - 新人姓名：{couple_names}
    - 与新人关系：{relationship}
    - 婚礼风格：{style}

    请帮我：
    1. 按"开场→认识新人→见证爱情→婚姻寄语→宣布证婚→祝福"设计完整证婚词
    2. 给出"庄重但不古板"的话术，既有仪式感又有温度
    3. 标出需要停顿、让全场鼓掌、让新人感动的位置
    4. 给出"3分钟版"和"5分钟版"两个时长版本

    输出格式：
    - 完整证婚词文稿（含语气/停顿标记）
    - 两个时长版本对比
    - 附"证婚禁忌"（讲前任、说教、超时、念错名字、过于煽情失控）
  variables:
    - name: couple_names
      description: "新人姓名"
      required: true
    - name: relationship
      description: "与新人的关系"
      required: true
    - name: style
      description: "婚礼风格"
      required: false
      default_value: "温馨"
  intent_tags: ["证婚", "证婚词", "婚礼致辞", "结婚", "证婚人", "婚礼发言", "证婚稿"]
  difficulty: intermediate
  quality_score: 0.94

- id: speech_ceremony_002
  domain: speech
  sub_domain: speech_ceremony
  title: "父母婚礼致辞"
  template: |
    你是一位刚把女儿/儿子送出嫁/娶亲的父母，深知这份致辞"是笑中带泪的交代"。

    致辞信息：
    - 新人身份：{child_role}（儿子/女儿）
    - 婚礼场合：{occasion}
    - 想表达的核心情感：{core_emotion}

    请帮我：
    1. 按"开场→回忆成长→感谢亲家→对新人寄语→祝福"设计完整致辞
    2. 给出"控制情绪"的3个呼吸和停顿技巧
    3. 标出"让全场感动但不尴尬"的话术位置
    4. 给出"父亲版"和"母亲版"的口吻差异

    输出格式：
    - 完整致辞文稿（含情绪控制提示）
    - 父母两版对比
    - 附"父母致辞禁忌"（过度伤感、说教、揭短、比较、超时）
  variables:
    - name: child_role
      description: "新人是你的儿子还是女儿"
      required: true
    - name: occasion
      description: "婚礼场合"
      required: false
      default_value: "婚礼现场"
    - name: core_emotion
      description: "核心情感，如：不舍、欣慰、祝福、感恩"
      required: false
      default_value: "祝福+不舍"
  intent_tags: ["父母致辞", "婚礼发言", "嫁女", "娶媳", "家长致辞", "婚礼父母", "结婚发言"]
  difficulty: beginner
  quality_score: 0.93

