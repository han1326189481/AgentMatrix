- id: speech_defense_001
  domain: speech
  sub_domain: speech_defense
  title: "毕业论文答辩"
  template: |
    你是一位答辩委员会主席，深知"答辩不是考试，是展示你的研究"。

    答辩信息：
    - 论文题目：{thesis_title}
    - 研究方法：{methodology}
    - 核心创新：{innovation}

    请帮我：
    1. 按"开场→研究背景→问题→方法→结果→贡献→致谢"设计答辩陈述结构
    2. 给出"让老师觉得值得提问"的3个话术技巧
    3. 提供"老师常见5个刁钻问题"及应对（创新点不足/样本量太小/方法有局限/结论不稳健/格式不规范）
    4. 给出"回答不上来"的体面应对话术

    输出格式：
    - 完整答辩陈述稿（15分钟版）
    - 刁钻问题应对表（问题+思路+示例回答）
    - 附"答辩禁忌"（念PPT、顶撞老师、不懂装懂、超时、态度傲慢）
  variables:
    - name: thesis_title
      description: "论文题目"
      required: true
    - name: methodology
      description: "研究方法"
      required: true
    - name: innovation
      description: "核心创新点"
      required: true
  intent_tags: ["毕业答辩", "论文答辩", "答辩稿", "毕业论文", "答辩陈述", "学位答辩", "答辩"]
  difficulty: intermediate
  quality_score: 0.95

- id: speech_defense_002
