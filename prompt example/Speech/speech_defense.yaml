    - 工作设想：{plan}

    请帮我：
    1. 按"开场→为什么竞聘→凭什么胜任→打算怎么做→接受挑战"设计答辩结构
    2. 给出"让评委觉得非你不可"的3个话术技巧
    3. 提供"评委常见5个压力问题"及应对（你经验不足/为什么不是别人/你最大的缺点/如果失败怎么办/上任后第一件事）
    4. 给出"被质疑短板"的转化话术

    输出格式：
    - 完整竞聘答辩稿
    - 压力问题应对表
    - 附"竞聘禁忌"（贬低同事、空口承诺、过度谦虚、回避问题、超时）
  variables:
    - name: target_position
      description: "竞聘岗位"
      required: true
    - name: advantages
      description: "核心优势"
      required: true
    - name: plan
      description: "工作设想"
      required: false
      default_value: "（用户未提供，给出通用框架）"
  intent_tags: ["竞聘答辩", "岗位竞聘", "晋升答辩", "竞聘演讲", "竞聘稿", "晋升面试", "竞聘"]
