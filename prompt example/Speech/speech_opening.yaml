- id: speech_opening_001
  domain: speech
  sub_domain: speech_opening
  title: "年会开场白"
  template: |
    你是一位企业年会金牌主持人，擅长用第一句话把全场气氛点燃。

    我的信息：
    - 公司/组织：{org_name}
    - 年会主题：{theme}
    - 我的身份：{my_role}

    请帮我：
    1. 写5种不同风格的开场白（幽默型/温情型/霸气型/文艺型/互动型），每种50-100字
    2. 给出"开场30秒抓住注意力"的3个钩子技巧
    3. 设计一个"全场互动"的开场小游戏或提问
    4. 给出开场后如何自然过渡到第一个环节的衔接语

    输出格式：
    - 5种风格开场白逐条列出，标注适用氛围
    - 钩子技巧用"原理+示例"说明
    - 互动设计包含：问题/动作/预期反应
  variables:
    - name: org_name
      description: "公司或组织名称"
      required: true
    - name: theme
      description: "年会主题"
      required: true
    - name: my_role
      description: "你的身份，如：总经理、部门代表、主持人"
      required: true
  intent_tags: ["年会开场", "开场白", "年会主持", "开场", "致辞开头", "年会致辞", "暖场"]
  difficulty: beginner
  quality_score: 0.92

- id: speech_opening_002
  domain: speech
  sub_domain: speech_opening
  title: "婚礼开场白"
  template: |
    你是一位婚礼司仪，擅长用第一句话让全场安静、第二句话让人微笑、第三句话让人想哭。

    婚礼信息：
    - 新人姓名：{couple_names}
    - 新人关系：{relationship}（如：同学/同事/朋友介绍）
    - 婚礼风格：{style}（温馨/搞笑/庄重）

    请帮我：
    1. 写5种婚礼开场白（故事型/祝福型/幽默型/诗词型/互动型），每种60-120字
    2. 给出"3秒控场"的声音和肢体语言提示
    3. 设计一个"让宾客鼓掌"的自然过渡点
    4. 给出"突发安静"或"有人喧哗"的救场话术

    输出格式：
    - 5种开场白完整文稿
    - 控场技巧用"要点+示范"列出
    - 救场话术单独成节
  variables:
    - name: couple_names
      description: "新人姓名"
      required: true
    - name: relationship
      description: "新人怎么认识的"
      required: false
      default_value: "（用户未提供，用通用版本）"
    - name: style
      description: "婚礼整体风格"
      required: false
      default_value: "温馨"
  intent_tags: ["婚礼开场", "婚礼致辞", "司仪", "开场白", "结婚", "婚礼主持", "证婚"]
  difficulty: beginner
  quality_score: 0.93

