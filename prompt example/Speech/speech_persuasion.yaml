- id: speech_persuasion_001
  domain: speech
  sub_domain: speech_persuasion
  title: "说服老板加薪"
  template: |
    你是一位职场谈判专家，深知"要加薪不是求，是展示价值"。

    谈判信息：
    - 当前薪资：{current_salary}
    - 期望涨幅：{expected_raise}
    - 核心业绩：{achievements}

    请帮我：
    1. 设计"数据开场→价值证明→市场对比→未来承诺→开口请求"的说服结构
    2. 给出"让老板无法拒绝"的3个话术技巧（不是威胁，是共赢）
    3. 提供"老板可能说的5句话"及应对策略（再等等/公司困难/你不够格/别人也没加/明年再说）
    4. 给出"被拒绝后如何体面收场"的话术

    输出格式：
    - 完整说服话术稿（含停顿和语气提示）
    - 老板回应应对表（话术+策略）
    - 附"加薪谈判禁忌"（威胁离职、情绪失控、拿同事比较、没有数据）
  variables:
    - name: current_salary
      description: "当前薪资水平"
      required: true
    - name: expected_raise
      description: "期望涨幅或金额"
      required: true
    - name: achievements
      description: "核心业绩和贡献"
      required: true
  intent_tags: ["加薪", "涨工资", "谈薪", "加薪谈判", "说服老板", "提加薪", "薪资谈判"]
  difficulty: intermediate
  quality_score: 0.94

- id: speech_persuasion_002
  domain: speech
  sub_domain: speech_persuasion
  title: "说服客户下单"
  template: |
    你是一位销冠教练，深知"说服客户不是推销，是解决他的问题"。

    销售信息：
    - 产品/服务：{product}
    - 客户痛点：{pain_point}
    - 客户犹豫点：{hesitation}

    请帮我：
    1. 设计"建立信任→挖掘痛点→展示方案→消除顾虑→促成行动"的说服结构
    2. 给出"让客户自己说服自己"的3个提问技巧
    3. 提供"客户常见5个拒绝理由"及破解话术（太贵/不需要/再考虑/没预算/找别人）
    4. 给出"临门一脚"的3种逼单话术（不让人反感）

    输出格式：
    - 完整销售话术流程
    - 拒绝破解表（理由+应对+转化）
    - 附"销售禁忌"（贬低对手、过度承诺、逼单太急、忽视客户感受）
  variables:
    - name: product
      description: "产品或服务"
      required: true
    - name: pain_point
      description: "客户核心痛点"
      required: true
    - name: hesitation
      description: "客户犹豫点"
      required: False
      default_value: "（用户未提供，给出通用应对）"
  intent_tags: ["说服客户", "销售话术", "成单技巧", "推销", "客户沟通", "销售技巧", "逼单"]
  difficulty: intermediate
  quality_score: 0.93

