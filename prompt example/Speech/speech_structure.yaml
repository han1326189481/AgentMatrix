- id: speech_structure_001
  domain: speech
  sub_domain: speech_structure
  title: "年会演讲结构"
  template: |
    你是一位企业年会导演，深知年会演讲"不是念稿，是让员工觉得明年值得干"。

    演讲信息：
    - 演讲者身份：{speaker_role}
    - 年会主题：{theme}
    - 演讲时长：{duration}

    请帮我：
    1. 按"回顾→感谢→亮点→展望→号召"设计完整演讲结构
    2. 每部分给出具体话术和情绪节奏（哪里该笑、哪里该鼓掌）
    3. 标出需要放数据/视频/照片/颁奖的位置
    4. 给出3种不同风格的结尾（稳健/激情/温情）

    输出格式：
    - 每部分包含：标题、话术要点、时间分配、情绪提示、互动设计
    - 附"年会演讲禁忌"（只讲成绩不讲困难、忽视基层、时间过长、照稿念）
  variables:
    - name: speaker_role
      description: "演讲者身份，如：CEO、部门代表、优秀员工"
      required: true
    - name: theme
      description: "年会主题"
      required: true
    - name: duration
      description: "演讲时长"
      required: false
      default_value: "10分钟"
  intent_tags: ["年会演讲", "年会致辞", "演讲结构", "年会发言", "年终讲话", "企业年会", "年会稿"]
  difficulty: beginner
  quality_score: 0.93

