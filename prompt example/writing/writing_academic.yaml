- id: writing_academic_002
  domain: writing
  sub_domain: writing_academic
  title: "论文摘要怎么写，审稿人第一眼就看这个"
  template: |
    你是一位期刊主编，深知"摘要写得好，审稿人愿意往下看；写不好，直接拒稿"。

    论文信息：
    - 论文标题：{title}
    - 研究背景：{background}
    - 研究方法：{method}
    - 核心发现：{findings}
    - 研究意义：{significance}
    - 字数要求：{word_limit}

    请直接输出一份完整的论文摘要（中英文），可直接投稿。

    要求：
    1. 结构完整：背景→目的→方法→结果→结论
    2. 不引用文献，不缩写，不自夸
    3. 数据具体，不说"显著提高"而说"提高了23%"
    4. 给出完整范文，不要只给框架

    输出格式：
    - 中文摘要
    - 英文摘要（Abstract）
    - 关键词（中英文）
  variables:
    - name: title
      description: "论文标题"
      required: true
    - name: background
      description: "研究背景"
      required: true
    - name: method
      description: "研究方法"
      required: true
    - name: findings
      description: "核心发现"
      required: true
    - name: significance
      description: "研究意义"
      required: true
    - name: word_limit
      description: "字数限制"
      options: ["200字", "300字", "500字", "800字"]
      required: false
      default_value: "300字"
  intent_tags: ["论文摘要", "摘要怎么写", "Abstract", "帮我写摘要", "投稿摘要", "学术摘要", "论文写作"]
  difficulty: intermediate
  quality_score: 0.94

- id: writing_academic_003
  domain: writing
  sub_domain: writing_academic
  title: "论文引言怎么写，开头就要抓住人"
  template: |
    你一位学术写作教练，深知"引言写得好，审稿人一口气看到方法部分"。

    论文信息：
    - 研究主题：{topic}
    - 研究背景：{background}
    - 现有研究不足：{gaps}
    - 研究问题：{question}
    - 研究贡献：{contribution}
    - 论文结构：{structure}

    请直接输出一份完整的论文引言，可直接用于期刊投稿。

    要求：
    1. 从大到小：领域→子领域→具体问题→我的研究
    2. 现有研究不足要具体，不笼统说"研究较少"
    3. 研究问题明确，一句话能说清
    4. 贡献要实在，不说"首次""填补空白"等大话
    5. 给出完整范文，不要只给框架

    输出格式：
    - 完整引言正文
    - 引言结构拆解（每段功能说明）
  variables:
    - name: topic
      description: "研究主题"
      required: true
    - name: background
      description: "研究背景"
      required: true
    - name: gaps
      description: "现有研究不足"
      required: true
    - name: question
      description: "研究问题"
      required: true
    - name: contribution
      description: "研究贡献"
      required: true
    - name: structure
      description: "论文结构概述"
      required: false
      default_value: "（用户未提供，给出通用结构）"
  intent_tags: ["论文引言", "Introduction", "引言怎么写", "帮我写引言", "论文开头", "学术写作", "投稿"]
  difficulty: intermediate
  quality_score: 0.94

