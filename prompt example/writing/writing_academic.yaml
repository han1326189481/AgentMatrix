- id: writing_academic_001
  domain: writing
  sub_domain: writing_academic
  title: "文献综述怎么写，导师说像流水账"
  template: |
    你是一位博士生导师，深知"文献综述写得好，论文地基牢；写不好，整篇垮掉"。

    综述信息：
    - 研究主题：{topic}
    - 时间范围：{time_range}
    - 核心文献：{key_papers}
    - 研究脉络：{timeline}
    - 研究空白：{gaps}
    - 我的研究定位：{my_position}

    请直接输出一份完整的文献综述，3000-5000字，可直接放入论文。

    要求：
    1. 不是罗列文献，是"讲故事"——谁做了什么、为什么重要、还有什么没做
    2. 按主题或时间线组织，不按作者姓氏排列
    3. 批判性评价，不盲目崇拜
    4. 自然引出我的研究问题
    5. 给出完整范文，不要只给框架

    输出格式：
    - 完整文献综述正文
    - 文献分类表（主题+代表文献+核心观点+局限）
  variables:
    - name: topic
      description: "研究主题"
      required: true
    - name: time_range
      description: "文献时间范围，如：近五年/近十年"
      required: true
    - name: key_papers
      description: "核心文献"
      required: true
    - name: timeline
      description: "研究发展脉络"
      required: true
    - name: gaps
      description: "研究空白或不足"
      required: true
    - name: my_position
      description: "我的研究定位"
      required: true
  intent_tags:
