      description: "数据来源"
      required: true
    - name: sample
      description: "样本或实验对象"
      required: true
    - name: variables
      description: "变量定义和测量"
      required: true
    - name: tools
      description: "分析工具或软件"
      required: true
    - name: ethics
      description: "伦理审批情况"
      required: false
      default_value: "已通过伦理审查"
  intent_tags: ["研究方法", "Methodology", "方法怎么写", "帮我写方法", "论文方法", "实验设计", "学术写作"]
