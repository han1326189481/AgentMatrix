- id: writing_business_001
  domain: writing
  sub_domain: writing_business
  title: "帮我写个放假通知，要正式但不死板"
  template: |
    你是一位有10年经验的行政文案专家，擅长写让所有人一看就懂的正式通知。

    通知信息：
    - 放假类型：{holiday_type}
    - 放假时间：{holiday_time}
    - 补班/值班安排：{arrangement}
    - 发布单位：{department}

    请直接输出一份完整的放假通知，用户只需替换括号内的具体信息即可使用。
    不要只给框架，要写出标题、称呼、正文每一段、落款的完整范文。

    要求：
    1. 语气{style}，符合{audience}的阅读习惯
    2. 包含放假原因、具体时间、注意事项、祝福语
    3. 格式规范，可直接复制到Word或钉钉/企业微信发布

    输出格式：
    - 完整通知正文（可直接复制使用）
    - 标注说明（告诉用户哪里需要替换）
  variables:
    - name: holiday_type
      description: "放假类型"
      options: ["春节", "国庆", "元旦", "清明", "劳动", "端午", "中秋", "年假", "调休", "其他"]
      required: true
    - name: holiday_time
      description: "放假具体时间，如：1月1日至1月3日共3天"
      required: true
    - name: arrangement
      description: "补班或值班安排"
      required: false
      default_value: "无特殊安排"
    - name: department
      description: "发布单位名称"
      required: true
    - name: style
      description: "通知风格"
      options: ["正式公文", "轻松亲切", "简洁明了"]
      required: false
      default_value: "正式公文"
    - name: audience
      description: "通知对象"
      options: ["全体员工", "全体学生", "全体家长", "各部门", "社会公众"]
      required: false
      default_value: "全体员工"
  intent_tags: ["放假通知", "通知怎么写", "帮我写通知", "行政文案", "公文模板", "放假公告", "调休通知", "写通知"]
  difficulty: beginner
  quality_score: 0.94

- id: writing_business_002
  domain: writing
  sub_domain: writing_business
  title: "会议通知怎么写，领导明天就要"
  template: |
    你是一位资深行政主管，写过上千份会议通知，深知"通知写不清楚，开会就乱套"。

    会议信息：
    - 会议主题：{topic}
    - 会议时间：{time}
    - 会议地点/线上链接：{location}
    - 参会人员：{attendees}
    - 需要准备的材料：{materials}
    - 发布单位：{department}

    请直接输出一份完整的会议通知，包含标题、称呼、正文、落款。
    用户只需替换括号内容即可直接使用。

    要求：
    1. 语气{style}
    2. 把时间、地点、要准备什么写清楚，不让参会人来回问
    3. 如果是线上会议，要包含入会方式和会议号
    4. 给出完整范文，不要只列123框架

    输出格式：
    - 完整会议通知正文
    - 参会须知（提醒带什么、提前多久到）
  variables:
    - name: topic
      description: "会议主题"
      required: true
    - name: time
      description: "会议时间，如：2026年8月1日（周五）上午9:00"
      required: true
    - name: location
      description: "会议地点或线上链接"
      required: true
    - name: attendees
      description: "参会人员范围"
      options: ["全体员工", "各部门负责人", "项目组全体成员", "全体党员", "班委会成员", "相关人员"]
      required: true
    - name: materials
      description: "需要准备的材料"
      required: false
      default_value: "无特殊要求"
    - name: department
      description: "发布单位"
      required: true
    - name: style
      description: "通知风格"
      options: ["正式严肃", "简洁明了", "亲切提醒"]
      required: false
      default_value: "正式严肃"
  intent_tags: ["会议通知", "开会通知", "怎么写通知", "帮我写会议通知", "行政文案", "会议安排", "通知模板"]
  difficulty: beginner
  quality_score: 0.94

- id: writing_business_003
  domain: writing
  sub_domain: writing_business
  title: "任免通知怎么写，要显得正式又得体"
  template: |
    你是一位组织人事部门的资深笔杆子，擅长拟写任免、任命类公文。

    任免信息：
    - 任免类型：{type}
    - 涉及人员：{person}
    - 任免职务：{position}
    - 生效时间：{effective_date}
    - 任免原因/依据：{reason}
    - 发文单位：{department}

    请直接输出一份完整的任免通知，格式规范，可直接印发或发布。

    要求：
    1. 符合党政机关/企事业单位公文格式规范
    2. 用词准确，不歧义
    3. 包含任免决定、生效时间、希望要求、落款
    4. 输出完整正文，不要只给提纲

    输出格式：
    - 完整任免通知正文
    - 格式说明（标题字号、落款位置等提醒）
  variables:
    - name: type
      description: "任免类型"
      options: ["任命", "免去", "兼任", "改任", "聘任"]
      required: true
    - name: person
      description: "涉及人员姓名"
      required: true
    - name: position
      description: "任免的职务名称"
      required: true
    - name: effective_date
      description: "生效时间"
      required: true
    - name: reason
      description: "任免原因或依据"
      required: false
      default_value: "根据工作需要"
    - name: department
      description: "发文单位全称"
      required: true
  intent_tags: ["任免通知", "任命通知", "公文写作", "人事任免", "正式公文", "帮我写任命书", "干部任免"]
  difficulty: intermediate
  quality_score: 0.93

