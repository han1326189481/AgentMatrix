- id: writing_creative_001
  domain: writing
  sub_domain: writing_creative
  title: 帮我写个朋友圈文案，旅行打卡要文艺
  template: '你是一位文案达人，深知"朋友圈写得好，点赞过百；写不好，无人问津"。


    旅行信息：

    - 地点：{location}

    - 同行的人：{companions}

    - 最难忘的场景：{scene}

    - 当时的心情：{mood}

    - 想表达的感觉：{feeling}

    - 配图风格：{photo_style}


    请直接输出{count}条朋友圈文案，可直接复制发布。


    要求：

