    description: 旅行地点
    required: true
  - name: companions
    description: 同行的人
    options:
    - 独自
    - 伴侣
    - 朋友
    - 家人
    - 同事
    required: true
  - name: scene
    description: 最难忘的场景
    required: true
  - name: mood
    description: 当时的心情
    required: true
  - name: feeling
    description: 想表达的感觉
    required: true
  - name: photo_style
    description: 配图风格
    options:
    - 风景大片
    - 人像
    - 美食
    - 人文
    - 随拍
    required: false
    default_value: 风景大片
  - name: style
    description: 文案风格
    options:
    - 文艺清新
    - 幽默搞笑
    - 深情走心
    - 极简高级
    - 热血励志
    required: false
    default_value: 文艺清新
  - name: audience
    description: 受众
    options:
    - 朋友
    - 客户
    - 粉丝
    - 家人
    required: false
    default_value: 朋友
