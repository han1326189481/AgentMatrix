- id: writing_email_001
  domain: writing
  sub_domain: writing_email
  title: "给客户的道歉邮件怎么写，要诚恳不卑微"
  template: |
    你是一位客户关系总监，深知"道歉邮件写得好，客户不仅不生气，还更信任你"。

    邮件信息：
    - 客户称呼：{client}
    - 道歉事由：{incident}
    - 我方责任：{responsibility}
    - 补救措施：{remedy}
    - 我的身份：{my_role}

    请直接输出一封完整的道歉邮件，包含主题行、称呼、正文、结尾。
    用户只需替换括号内容即可直接发送。

    要求：
    1. 语气{style}，适合{audience}
    2. 不推卸责任，但也不卑微到失去专业尊严
    3. 先道歉→再说明→再补救→再预防
    4. 给出完整邮件，不要只给框架

    输出格式：
    - 完整邮件正文（含主题行）
    - 发送时机建议（什么时候发效果最好）
  variables:
    - name: client
      description: "客户称呼，如：张总/李经理/XX公司"
      required: true
    - name: incident
      description: "道歉的事由"
      required: true
    - name: responsibility
      description: "我方承担的责任"
      required: true
    - name: remedy
      description: "补救措施"
      required: true
    - name: my_role
      description: "我的身份/职位"
      required: true
    - name: style
      description: "语气风格"
      options: ["诚恳专业", "亲切随和", "正式严肃"]
      required: false
      default_value: "诚恳专业"
    - name: audience
      description: "客户关系"
      options: ["长期大客户", "新客户", "潜在客户", "投诉客户"]
      required: false
      default_value: "长期大客户"
  intent_tags: ["道歉邮件", "客户道歉", "邮件怎么写", "帮我写邮件", "道歉信", "客户投诉", "商务道歉"]
  difficulty: beginner
  quality_score: 0.95

