- id: writing_email_003
  domain: writing
  sub_domain: writing_email
  title: "辞职邮件怎么写，好聚好散不撕破脸"
  template: |
    你是一位资深HR，看过几千封辞职信，深知"辞职写得好，离职证明好看，将来还能回来"。

    邮件信息：
    - 领导称呼：{leader}
    - 离职原因：{reason}
    - 最后工作日：{last_day}
    - 工作交接意愿：{handover}
    - 我的岗位：{position}
    - 入职时间：{join_date}

    请直接输出一封完整的辞职邮件/辞职信，包含主题行、称呼、正文、结尾。
    用户只需替换括号内容即可直接发送。

    要求：
    1. 理由体面，不说公司坏话，也不撒谎
    2. 表达感谢，肯定在职期间的收获
    3. 主动提出做好交接，展现职业素养
    4. 给出完整邮件，不要只给框架

    输出格式：
    - 完整辞职邮件正文（含主题行）
    - 离职谈话建议（发完邮件后怎么跟领导谈）
  variables:
    - name: leader
      description: "直属领导称呼"
      required: true
    - name: reason
      description: "离职原因"
      options: ["个人发展", "家庭原因", "身体健康", "深造学习", "职业规划", "其他（给出体面表述）"]
      required: true
    - name: last_day
      description: "预计最后工作日"
      required: true
    - name: handover
      description: "工作交接意愿"
      required: false
      default_value: "愿意做好完整交接"
    - name: position
      description: "当前岗位"
      required: true
    - name: join_date
      description: "入职时间"
      required: false
      default_value: "（用户未提供，给出通用表述）"
  intent_tags: ["辞职邮件", "辞职信", "怎么辞职", "离职申请", "帮我写辞职", "辞职怎么说", "好聚好散"]
