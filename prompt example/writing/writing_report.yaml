- id: writing_report_001
  domain: writing
  sub_domain: writing_report
  title: "调研报告怎么写，领导要听真话"
  template: |
    你是一位资深调研员，深知"调研报告写得好，决策不跑偏；写不好，白跑一趟"。

    调研信息：
    - 调研主题：{topic}
    - 调研对象/范围：{scope}
    - 调研方法：{method}
    - 主要发现：{findings}
    - 存在问题：{problems}
    - 对策建议：{suggestions}
    - 报告单位：{department}

    请直接输出一份完整的调研报告，3000-5000字，可直接提交。

    要求：
    1. 用{style}风格，适合{audience}阅读
    2. 数据真实，不编造
    3. 问题要尖锐但客观，建议要可操作
    4. 结构：背景→方法→现状→问题→建议→附录
    5. 给出完整范文，不要只给框架

    输出格式：
    - 完整调研报告正文
    - 调研问卷/访谈提纲模板（如有）
  variables:
    - name: topic
      description: "调研主题"
      required: true
    - name: scope
      description: "调研对象和范围"
      required: true
    - name: method
      description: "调研方法"
      options: ["问卷调查", "深度访谈", "实地走访", "数据分析", "文献研究", "混合方法"]
      required: true
    - name: findings
      description: "主要发现"
      required: true
    - name: problems
      description: "发现的问题"
      required: true
    - name: suggestions
      description: "对策建议"
      required: true
    - name: department
      description: "报告单位"
      required: true
    - name: style
      description: "写作风格"
      options: ["务实客观", "问题导向", "数据驱动", "政策建议"]
      required: false
      default_value: "务实客观"
    - name: audience
      description: "阅读对象"
      options: ["党政机关", "企业管理层", "学术评审", "社会公众"]
      required: false
      default_value: "党政机关"
  intent_tags: ["调研报告", "调查报告", "怎么写调研", "帮我写报告", "调研材料", "实地考察", "调研汇报"]
  difficulty: intermediate
  quality_score: 0.94

